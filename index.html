<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2F6B3F">
<meta name="description" content="Menus équilibrés pour le foyer, selon le budget.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Mieux Manger">
<title>Mieux Manger</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=DM+Sans:wght@400;500;600&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
[hidden]{display:none!important}
/* Layout : une colonne façon app mobile, une question par écran, action principale en bas */
:root{
  --bg:#F6F7F2; --surface:#FFFFFF; --line:#D9DED3; --track:#E3E7DD;
  --fg:#1F2A22; --muted:#4A554D; --subtle:#5B665E;
  --primary:#2F6B3F; --primary-hover:#25573A; --on-primary:#FFFFFF; --primary-soft:#E8F1E9; --primary-ink:#1F4A2B;
  --accent:#C2471F; --accent-soft:#FFF1E8; --accent-ink:#6B4A38;
  --gold:#C99A2E; --hero:#1F3D29; --on-hero:#FFFFFF; --hero-muted:#CFE3D3;
  --error:#B3261E;
  --display:'Bricolage Grotesque', 'Trebuchet MS', system-ui, sans-serif;
  --body:'DM Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111713; --surface:#1A221D; --line:#2F3B33; --track:#28322B;
  --fg:#E8EEE7; --muted:#B9C4BB; --subtle:#A2AEA5;
  --primary:#72C089; --primary-hover:#8ACF9E; --on-primary:#0E1A12; --primary-soft:#1E3326; --primary-ink:#BFE3C9;
  --accent:#F08A5D; --accent-soft:#2D1F18; --accent-ink:#F2C6B1;
  --gold:#E3BE5E; --hero:#1B3524; --on-hero:#F2F7F2; --hero-muted:#B9D6C1;
  --error:#F2A39D; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#111713; --surface:#1A221D; --line:#2F3B33; --track:#28322B;
  --fg:#E8EEE7; --muted:#B9C4BB; --subtle:#A2AEA5;
  --primary:#72C089; --primary-hover:#8ACF9E; --on-primary:#0E1A12; --primary-soft:#1E3326; --primary-ink:#BFE3C9;
  --accent:#F08A5D; --accent-soft:#2D1F18; --accent-ink:#F2C6B1;
  --gold:#E3BE5E; --hero:#1B3524; --on-hero:#F2F7F2; --hero-muted:#B9D6C1;
  --error:#F2A39D; color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px}
*{box-sizing:border-box}
button,input{font-family:inherit;color:inherit}
:focus-visible{outline:3px solid var(--primary);outline-offset:2px}
.app{max-width:440px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;
  padding-block:20px 28px;padding-left:max(20px, env(safe-area-inset-left, 0px));padding-right:max(20px, env(safe-area-inset-right, 0px))}
.top{display:flex;align-items:center;gap:12px;min-height:44px}
.icon-btn{width:44px;height:44px;border-radius:22px;border:1px solid var(--line);background:var(--surface);display:flex;align-items:center;justify-content:center;padding:0;cursor:pointer;flex-shrink:0}
.icon-btn svg{stroke:var(--fg)}
.progress{flex:1;height:6px;border-radius:3px;background:var(--track);overflow:hidden}
.progress>div{height:100%;background:var(--primary);border-radius:3px;transition:width .3s ease}
.count{font-size:13px;font-weight:500;color:var(--subtle);font-variant-numeric:tabular-nums}
.head{margin-top:36px;display:flex;flex-direction:column;gap:10px}
.eyebrow{font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--subtle)}
h1{margin:0;font-family:var(--display);font-weight:700;font-size:32px;line-height:1.1;text-wrap:balance}
.lead{margin:0;font-size:16px;line-height:1.5;color:var(--muted)}
.body{margin-top:28px;display:flex;flex-direction:column;gap:20px}
.field{display:flex;flex-direction:column;gap:8px}
.label{font-size:14px;font-weight:600}
.hint{font-size:13px;color:var(--subtle);line-height:1.4}
.input{height:56px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);padding:0 16px;font-size:17px;width:100%}
.input:focus{border-color:var(--primary);outline:none}
.unit{display:flex;align-items:center;gap:6px;height:56px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);padding:0 16px}
.unit:focus-within{border-color:var(--primary)}
.unit input{border:none;background:transparent;font-size:17px;width:100%;padding:0;outline:none}
.unit span{font-size:15px;color:var(--subtle)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.tile{min-height:96px;border-radius:16px;border:1.5px solid var(--line);background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;font-size:16px;font-weight:500;cursor:pointer;padding:10px}
.tile svg{stroke:var(--subtle)}
.tile[aria-pressed="true"]{border:2px solid var(--primary);background:var(--primary-soft);font-weight:600}
.tile[aria-pressed="true"] svg{stroke:var(--primary)}
.seg{display:flex;gap:6px;padding:4px;border-radius:14px;background:var(--track)}
.seg button{flex:1;min-height:44px;border-radius:11px;border:none;background:transparent;font-size:15px;font-weight:500;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);font-weight:600}
.options{display:flex;flex-direction:column;gap:10px}
.opt{min-height:68px;border-radius:16px;border:1.5px solid var(--line);background:var(--surface);display:flex;align-items:center;gap:14px;padding:12px 16px;text-align:left;cursor:pointer;width:100%}
.opt .dot{width:22px;height:22px;border-radius:11px;border:2px solid var(--line);flex-shrink:0;background:var(--surface)}
.opt[aria-pressed="true"]{border:2px solid var(--primary);background:var(--primary-soft)}
.opt[aria-pressed="true"] .dot{border:7px solid var(--primary)}
.opt[disabled]{opacity:.5;cursor:not-allowed}
.opt-t{display:flex;flex-direction:column;gap:2px;min-width:0}
.opt-t b{font-size:16px;font-weight:600}
.opt-t small{font-size:14px;color:var(--subtle);line-height:1.35}
.toggle{min-height:64px;border-radius:16px;background:var(--accent-soft);display:flex;align-items:center;gap:14px;padding:12px 16px;cursor:pointer}
.toggle .opt-t small{color:var(--accent-ink)}
.toggle input{width:24px;height:24px;accent-color:var(--accent);margin:0;flex-shrink:0}
.toggle.green{background:var(--primary-soft)}
.toggle.green .opt-t small{color:var(--primary-ink)}
.toggle.green input{accent-color:var(--primary)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:40px;padding:8px 14px;border-radius:20px;border:1.5px solid var(--line);background:var(--surface);font-size:15px;cursor:pointer}
.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-ink);font-weight:600}
.tag{font-size:14px;padding:7px 12px;border-radius:16px;background:var(--primary-soft);color:var(--primary-ink)}
.tag.warn{background:var(--accent-soft);color:var(--accent-ink)}
.error{color:var(--error);font-size:14px;font-weight:500;min-height:1em}
.spacer{flex:1;min-height:28px}
.actions{display:flex;flex-direction:column;gap:10px}
.btn{min-height:56px;border-radius:28px;border:none;background:var(--primary);color:var(--on-primary);font-size:17px;font-weight:600;cursor:pointer;padding:0 20px}
.btn:hover{background:var(--primary-hover)}
.btn.ghost{background:transparent;border:1.5px solid var(--primary);color:var(--primary)}
.btn.ghost:hover{background:var(--primary-soft)}
.btn.text{background:transparent;color:var(--subtle);min-height:44px;font-size:15px;font-weight:500}
.btn.danger{background:var(--error);color:var(--surface)}
.hero{border-radius:20px;background:var(--hero);color:var(--on-hero);padding:22px 20px;display:flex;flex-direction:column;gap:6px}
.hero .row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.hero small{font-size:14px;color:var(--hero-muted);line-height:1.4}
.big{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.big b{font-family:var(--display);font-weight:700;font-size:48px;line-height:1;font-variant-numeric:tabular-nums}
.big span{font-size:16px;color:var(--hero-muted)}
.card{border-radius:20px;background:var(--surface);border:1px solid var(--line);padding:18px 20px;display:flex;flex-direction:column;gap:14px}
.bar{display:flex;height:12px;border-radius:6px;overflow:hidden;gap:3px}
.macros{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.macros div{display:flex;flex-direction:column;gap:2px}
.macros span{font-size:13px;color:var(--subtle);display:flex;align-items:center;gap:6px}
.macros i{width:8px;height:8px;border-radius:4px;display:inline-block}
.macros b{font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}
.person{display:flex;align-items:center;gap:14px}
.avatar{width:44px;height:44px;border-radius:22px;background:var(--primary-soft);color:var(--primary-ink);font-family:var(--display);font-weight:700;font-size:18px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.person .opt-t{flex:1}
.link{background:none;border:none;color:var(--primary);font-weight:600;font-size:15px;cursor:pointer;min-height:44px;padding:0 4px}
.section-title{font-family:var(--display);font-size:20px;font-weight:700;margin:8px 0 0}
.note{font-size:13px;color:var(--subtle);line-height:1.45;margin:0}
.search{display:flex;align-items:center;gap:10px;height:52px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);padding:0 14px}
.search:focus-within{border-color:var(--primary)}
.search input{border:none;background:transparent;font-size:16px;width:100%;outline:none;padding:0}
.search svg{stroke:var(--subtle);flex-shrink:0}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chips.scroll .chip{flex-shrink:0}
.rbody{display:flex;flex-direction:column;gap:14px;padding:14px;border-radius:14px;background:var(--bg)}
.rbody h3{margin:0;font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--subtle)}
.ing{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.ing li{display:flex;justify-content:space-between;gap:12px;font-size:15px;border-bottom:1px dashed var(--line);padding-bottom:6px}
.ing li span:last-child{color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.steps{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:8px;font-size:15px;line-height:1.5}
.steps li::marker{font-weight:700;color:var(--primary)}
.stepper{display:flex;align-items:center;gap:10px}
.stepper button{width:44px;height:44px;border-radius:22px;border:1.5px solid var(--line);background:var(--surface);font-size:20px;cursor:pointer}
.stepper b{min-width:28px;text-align:center;font-size:18px;font-variant-numeric:tabular-nums}
.linkbtn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;font-size:15px;text-decoration:none;padding:0 16px}
.rcard{display:flex;flex-direction:column;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.rcard:last-child{border-bottom:none}
.rhead{display:flex;align-items:flex-start;gap:12px;background:none;border:none;padding:0;text-align:left;cursor:pointer;width:100%}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom, 0px));background:var(--fg);color:var(--bg);padding:12px 18px;border-radius:24px;font-size:15px;font-weight:500;max-width:calc(100% - 32px);box-shadow:0 6px 24px rgba(0,0,0,.18);opacity:0;pointer-events:none;transition:opacity .2s ease;z-index:20}
#toast.show{opacity:1}
#print{display:none}
@media print{
  :root{padding:0!important}
  body{background:#fff!important;color:#000!important}
  #app,#toast{display:none!important}
  #print{display:block;font-family:var(--body);color:#000;font-size:11pt}
  .ph{display:flex;justify-content:space-between;align-items:baseline;border-bottom:2px solid #2F6B3F;padding-bottom:6pt;margin-bottom:10pt}
  .ph b{font-family:var(--display);font-size:16pt;color:#2F6B3F}
  .pr{break-inside:avoid;page-break-inside:avoid;padding:10pt 0 12pt;border-bottom:1px solid #bbb}
  .pr h2{font-family:var(--display);font-size:17pt;margin:0 0 2pt}
  .pm{margin:0 0 8pt;color:#444;font-size:10pt}
  .pc{display:grid;grid-template-columns:2fr 3fr;gap:18pt}
  .pc h3{font-size:9pt;letter-spacing:.08em;text-transform:uppercase;margin:0 0 4pt;color:#2F6B3F}
  .pc ul,.pc ol{margin:0;padding-left:14pt}
  .pc li{margin-bottom:3pt;line-height:1.35}
  .pweek{width:100%;border-collapse:collapse;margin-bottom:12pt}
  .pweek td,.pweek th{border-bottom:1px solid #ccc;padding:4pt 6pt;text-align:left;vertical-align:top;font-size:10pt}
  @page{margin:14mm}
}
@media (prefers-reduced-motion: reduce){.progress>div{transition:none}#toast{transition:none}}
</style>
</head>
<body>
<main class="app" id="app"></main>
<div id="print"></div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
const KEY = 'mieux-manger.v1';
const icons = {
  back:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>',
  adult:'<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="7" r="4"/><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"/></svg>',
  trash:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="color:var(--subtle)"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>',
  child:'<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="9" r="3"/><path d="M6.5 21c0-3.2 2.5-5.5 5.5-5.5s5.5 2.3 5.5 5.5"/></svg>'
};
const ACTIVITY = [
  {id:'sedentaire', t:'Sédentaire', d:'Assis la plupart du temps', f:1.2},
  {id:'legere', t:'Légère', d:'Marche, un peu de sport', f:1.375},
  {id:'moderee', t:'Modérée', d:'Sport 2 à 3 fois par semaine', f:1.55},
  {id:'intense', t:'Intense', d:'Entraînement quasi quotidien', f:1.725}
];
const GOALS = [
  {id:'equilibre', t:'Manger plus équilibré', d:'Mêmes quantités, meilleure qualité', k:0},
  {id:'maintien', t:'Garder mon poids', d:'Apports calés sur tes dépenses', k:0},
  {id:'perte', t:'Perdre doucement', d:'Léger déficit, 0,5 kg/semaine maximum', k:-0.15},
  {id:'muscle', t:'Prendre du muscle', d:'Un peu plus d’énergie et de protéines', k:0.1}
];
const DIETS = [
  {id:'omnivore', t:'Omnivore', d:'Viande, poisson, tout'},
  {id:'flexi', t:'Flexitarien', d:'Viande 2 à 3 fois par semaine'},
  {id:'vege', t:'Végétarien', d:'Ni viande ni poisson'}
];
const ALLERGENS = ['Gluten','Lactose','Arachides','Fruits à coque','Œufs','Poisson','Crustacés','Mollusques','Soja','Sésame','Moutarde'];
const BIO = [
  {id:'non', t:'Pas de bio', d:'Priorité au prix'},
  {id:'cles', t:'Quelques produits clés', d:'Fruits et légumes les plus traités en bio'},
  {id:'max', t:'Le plus possible', d:'Autant de bio que le budget le permet'}
];

function blankPerson(){ return {id:String(Date.now()), prenom:'', type:'adulte', sexe:'homme', naissance:'', taille:'', poids:'', activite:'moderee', metier:false, objectif:'equilibre', regime:'omnivore', moinsSucre:true, evites:'', allergies:[], autreAllergie:''}; }
function blankFoyer(){ return {budget:'', bio:'cles', tempsSemaine:'30', tempsWeekend:'60', midi:'non', soirLeger:false, cuisines:[], cuisineStrict:false, done:false}; }

let S = load() || {people:[], foyer:blankFoyer()};
let view = S.people.length ? {name:'home'} : {name:'person', step:0, draft:blankPerson(), isNew:true};
let error = '';
let confirmReset = false;

function load(){ try{ const r = localStorage.getItem(KEY); return r ? JSON.parse(r) : null; }catch(e){ return null; } }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
function esc(s){ return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmt(n){ return Math.round(n).toLocaleString('fr-FR'); }

function age(dateStr){
  if(!dateStr) return null;
  const b = new Date(dateStr), n = new Date();
  if(isNaN(b)) return null;
  let a = n.getFullYear() - b.getFullYear();
  const m = n.getMonth() - b.getMonth();
  if(m < 0 || (m === 0 && n.getDate() < b.getDate())) a--;
  return a;
}
function imc(p){ const t = +p.taille/100, w = +p.poids; return t && w ? w/(t*t) : null; }

function needs(p){
  const a = age(p.naissance);
  if(p.type === 'enfant'){
    if(a === null) return {child:true};
    const bands = [[1,0],[4,35],[7,50],[11,70],[15,90],[18,100]];
    let pct = 100; for(const [max,v] of bands){ if(a < max){ pct = v; break; } }
    return {child:true, age:a, pct};
  }
  const w = +p.poids, h = +p.taille;
  const bmr = 10*w + 6.25*h - 5*a + (p.sexe === 'homme' ? 5 : -161);
  let f = ACTIVITY.find(x => x.id === p.activite).f + (p.metier ? 0.15 : 0);
  f = Math.min(f, 1.95);
  const tdee = bmr * f;
  const g = GOALS.find(x => x.id === p.objectif);
  let kcal = tdee * (1 + g.k);
  if(kcal < bmr * 1.1) kcal = bmr * 1.1; // jamais en dessous du métabolisme de base
  const protPerKg = (p.objectif === 'muscle' || p.objectif === 'perte') ? 1.6 : 1.2;
  const prot = protPerKg * w;
  const lip = kcal * 0.3 / 9;
  const glu = Math.max(0, (kcal - prot*4 - lip*9) / 4);
  return {kcal, prot, lip, glu, age:a,
    split:[prot*4/kcal, glu*4/kcal, lip*9/kcal]};
}

function stepsFor(p){ return p.type === 'enfant' ? ['identite','corps','habitudes','allergies'] : ['identite','corps','activite','objectif','habitudes','allergies']; }

/* ---------- Rendu ---------- */
function topBar(pct, label, canBack){
  return `<div class="top">
    ${canBack ? `<button class="icon-btn" aria-label="Retour" data-act="back">${icons.back}</button>` : ''}
    <div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${Math.round(pct)}"><div style="width:${pct}%"></div></div>
    <span class="count">${label}</span></div>`;
}
function head(eyebrow, title, lead){
  return `<div class="head"><span class="eyebrow">${eyebrow}</span><h1>${title}</h1>${lead ? `<p class="lead">${lead}</p>` : ''}</div>`;
}
function optList(list, field, value, disabledFn){
  return `<div class="options">${list.map(o => {
    const dis = disabledFn ? disabledFn(o) : '';
    return `<button class="opt" aria-pressed="${value === o.id}" data-set="${field}" data-val="${o.id}" ${dis ? 'disabled' : ''}>
      <span class="dot" aria-hidden="true"></span><span class="opt-t"><b>${o.t}</b><small>${dis || o.d}</small></span></button>`;
  }).join('')}</div>`;
}

function renderPersonStep(){
  const p = view.draft, steps = stepsFor(p), id = steps[view.step];
  const pct = (view.step + 1) / steps.length * 100;
  const canBack = view.step > 0 || S.people.length > 0;
  const name = p.prenom.trim() || 'cette personne';
  let h = topBar(pct, `${view.step+1}/${steps.length}`, canBack);

  if(id === 'identite'){
    h += head('Profil', S.people.length ? 'Qui d’autre mange à la maison ?' : 'Qui mange à la maison ?',
      S.people.length ? '' : 'On commence par la première personne. Tu pourras ajouter le reste du foyer ensuite.');
    h += `<div class="body">
      <div class="field"><label class="label" for="prenom">Prénom</label>
        <input class="input" id="prenom" data-field="prenom" type="text" autocomplete="given-name" placeholder="ex. Maxime" value="${esc(p.prenom)}"></div>
      <div class="field"><span class="label">C’est…</span>
        <div class="grid2">
          <button class="tile" aria-pressed="${p.type==='adulte'}" data-set="type" data-val="adulte">${icons.adult}Un adulte</button>
          <button class="tile" aria-pressed="${p.type==='enfant'}" data-set="type" data-val="enfant">${icons.child}Un enfant</button>
        </div><span class="hint">Moins de 18 ans : on adapte les portions, sans objectif de poids.</span></div></div>`;
  }
  if(id === 'corps'){
    const child = p.type === 'enfant';
    h += head('Corps', 'Quelques mesures', child ? 'Pour un enfant, la date de naissance suffit à adapter les portions.' : 'Elles servent uniquement à calculer les portions. Tout reste sur ton téléphone.');
    h += `<div class="body">
      ${child ? '' : `<div class="field"><span class="label">Sexe</span><div class="seg">
        <button aria-pressed="${p.sexe==='homme'}" data-set="sexe" data-val="homme">Homme</button>
        <button aria-pressed="${p.sexe==='femme'}" data-set="sexe" data-val="femme">Femme</button></div></div>`}
      <div class="field"><label class="label" for="naissance">Date de naissance</label>
        <input class="input" id="naissance" data-field="naissance" type="date" value="${esc(p.naissance)}"></div>
      ${child ? '' : `<div class="grid2">
        <div class="field"><label class="label" for="taille">Taille</label><div class="unit"><input id="taille" data-field="taille" inputmode="numeric" placeholder="178" value="${esc(p.taille)}"><span>cm</span></div></div>
        <div class="field"><label class="label" for="poids">Poids</label><div class="unit"><input id="poids" data-field="poids" inputmode="decimal" placeholder="80" value="${esc(p.poids)}"><span>kg</span></div></div>
      </div>`}</div>`;
  }
  if(id === 'activite'){
    h += head('Mode de vie', `${esc(name)} bouge combien ?`);
    h += `<div class="body">${optList(ACTIVITY, 'activite', p.activite)}
      <label class="toggle" for="metier"><span class="opt-t" style="flex:1"><b>Métier physique</b><small>Chantier, port de charges, debout toute la journée</small></span>
      <input id="metier" type="checkbox" data-check="metier" ${p.metier ? 'checked' : ''}></label></div>`;
  }
  if(id === 'objectif'){
    const i = imc(p);
    h += head('Objectif', 'Qu’est-ce qui compte le plus ?', 'Tu pourras changer d’objectif à tout moment.');
    h += `<div class="body">${optList(GOALS, 'objectif', p.objectif, o => (o.id === 'perte' && i !== null && i < 20) ? 'Pas proposé : le poids actuel est déjà dans la zone basse' : '')}</div>`;
  }
  if(id === 'habitudes'){
    h += head('Habitudes', 'Ce que mange ' + esc(name));
    h += `<div class="body">${optList(DIETS, 'regime', p.regime)}
      <label class="toggle green" for="sucre"><span class="opt-t" style="flex:1"><b>Moins de sucre</b><small>Moins de produits sucrés et de desserts industriels</small></span>
      <input id="sucre" type="checkbox" data-check="moinsSucre" ${p.moinsSucre ? 'checked' : ''}></label>
      <div class="field"><label class="label" for="evites">Aliments à éviter (goût)</label>
        <input class="input" id="evites" data-field="evites" type="text" placeholder="ex. champignons, betterave" value="${esc(p.evites)}">
        <span class="hint">Sépare par des virgules.</span></div></div>`;
  }
  if(id === 'allergies'){
    h += head('Santé', 'Allergies ou intolérances ?', 'Ces aliments seront totalement exclus des menus de ' + esc(name) + '.');
    h += `<div class="body"><div class="chips">${ALLERGENS.map(a => `<button class="chip" aria-pressed="${p.allergies.includes(a)}" data-allergen="${esc(a)}">${esc(a)}</button>`).join('')}</div>

  }
  h += `<div class="spacer"></div><p class="error" role="alert">${esc(error)}</p>
    <div class="actions"><button class="btn" data-act="next">${view.step === steps.length - 1 ? 'Voir le récap' : 'Continuer'}</button></div>`;
  return h;
}

function nutritionBlock(p, n){
  if(n.child){
    if(n.age === null) return '';
    if(n.age < 1) return `<div class="hero"><small>Moins d’un an</small><b style="font-family:var(--display);font-size:24px">Repas à voir avec le pédiatre</b><small>La diversification suit un calendrier précis. L’app n’en tiendra pas compte dans les menus.</small></div>`;
    return `<div class="hero"><div class="row"><small>Portion estimée</small><small>${n.age} an${n.age>1?'s':''}</small></div>
      <div class="big"><b>${n.pct} %</b><span>d’une portion adulte</span></div>
      <small>Repère approximatif par tranche d’âge, pour dimensionner les courses.</small></div>`;
  }
  const ac = ACTIVITY.find(x => x.id === p.activite).t.toLowerCase();
  const go = GOALS.find(x => x.id === p.objectif).t.toLowerCase();
  return `<div class="hero"><div class="row"><small>Besoin estimé</small><small>${n.age} ans</small></div>
    <div class="big"><b>${fmt(n.kcal)}</b><span>kcal / jour</span></div>
    <small>Activité ${ac}${p.metier ? ' + métier physique' : ''} · ${go}</small></div>
    <div class="card"><div class="bar" aria-hidden="true">
      <div style="width:${n.split[0]*100}%;background:var(--accent)"></div>
      <div style="width:${n.split[1]*100}%;background:var(--primary)"></div>
      <div style="width:${n.split[2]*100}%;background:var(--gold)"></div></div>
    <div class="macros">
      <div><span><i style="background:var(--accent)"></i>Protéines</span><b>${fmt(n.prot)} g</b></div>
      <div><span><i style="background:var(--primary)"></i>Glucides</span><b>${fmt(n.glu)} g</b></div>
      <div><span><i style="background:var(--gold)"></i>Lipides</span><b>${fmt(n.lip)} g</b></div></div></div>`;
}
function tagsFor(p){
  const t = [`<span class="tag">${DIETS.find(d => d.id === p.regime).t}</span>`];
  if(p.moinsSucre) t.push('<span class="tag">Moins de sucre</span>');
  p.evites.split(',').map(s => s.trim()).filter(Boolean).forEach(s => t.push(`<span class="tag">Sans ${esc(s.toLowerCase())}</span>`));
  [...p.allergies, ...(p.autreAllergie.trim() ? [p.autreAllergie.trim()] : [])].forEach(a => t.push(`<span class="tag warn">Allergie : ${esc(a.toLowerCase())}</span>`));
  return `<div class="chips">${t.join('')}</div>`;
}

function delConfirm(p){
  return `<div class="card" style="gap:10px"><b>Supprimer le profil de ${esc(p.prenom)} ?</b>
    <p class="note">Ses mesures et préférences seront effacées. Les menus seront recalculés pour le reste du foyer.</p>
    <div class="grid2"><button class="btn ghost" data-act="cancel-del">Annuler</button><button class="btn danger" data-act="del" data-id="${p.id}">Supprimer</button></div></div>`;
}
function renderRecap(){
  const p = S.people.find(x => x.id === view.id);

  return topBar(100, 'Terminé', true) + head('Profil de ' + esc(p.prenom), 'Repères du jour') +
    `<div class="body">${nutritionBlock(p, n)}${tagsFor(p)}
    <p class="note">Estimation par la formule de Mifflin-St Jeor et ton niveau d’activité. C’est un repère pour les menus, pas un objectif à suivre à la calorie près.</p></div>
    <div class="spacer"></div><div class="actions">
      ${view.delId === p.id ? delConfirm(p) : `<div class="grid2"><button class="btn text" data-act="edit" data-id="${p.id}">Modifier ce profil</button>
      <button class="btn text" style="color:var(--error)" data-act="ask-del" data-id="${p.id}">Supprimer ce profil</button></div>`}
      <button class="btn ghost" data-act="add">Ajouter une personne</button>
      <button class="btn" data-act="${S.foyer.done ? 'home' : 'foyer'}">${S.foyer.done ? 'Voir le foyer' : 'Passer au foyer et au budget'}</button></div>`;
}

function renderFoyer(){

  if(view.step === 0){
    h += head('Budget', 'Combien pour les courses ?', `Pour ${S.people.length} personne${S.people.length>1?'s':''}, par semaine.`);
    h += `<div class="body"><div class="field"><label class="label" for="budget">Budget par semaine</label>
      <div class="unit"><input id="budget" data-field="budget" inputmode="numeric" placeholder="ex. 90" value="${esc(f.budget)}"><span>€</span></div></div>
      <div class="field"><span class="label">Le bio</span>${optList(BIO, 'bio', f.bio)}</div></div>`;
  } else if(view.step === 2){
    const sel = f.cuisines || [];
    h += head('Envies', 'Quelles cuisines vous plaisent ?', 'Choisis-en autant que tu veux. Sans choix, l’app mélange tout.');
    h += `<div class="body"><div class="chips">${CUISINES.map(c => `<button class="chip" aria-pressed="${sel.includes(c.id)}" data-cuisine="${c.id}">${c.t}</button>`).join('')}</div>

      <label class="toggle" for="decouverte"><span class="opt-t" style="flex:1"><b>Un plat à découvrir chaque semaine</b><small>Au moins une recette que vous n’avez sans doute jamais faite</small></span>
      <input id="decouverte" type="checkbox" data-check="decouverte" ${f.decouverte !== false ? 'checked' : ''}></label></div>`;
  } else {
    const segT = (field, opts) => `<div class="seg">${opts.map(([v,l]) => `<button aria-pressed="${f[field]===v}" data-set="${field}" data-val="${v}">${l}</button>`).join('')}</div>`;

    h += `<div class="body">
      <div class="field"><span class="label">En semaine</span>${segT('tempsSemaine', [['15','15 min'],['30','30 min'],['45','45 min +']])}</div>
      <div class="field"><span class="label">Le week-end</span>${segT('tempsWeekend', [['30','30 min'],['60','1 h'],['90','1 h 30 +']])}</div>

      <label class="toggle green" for="leger"><span class="opt-t" style="flex:1"><b>Soirs plus légers</b><small>Viande, poisson et féculents le midi ; salades, soupes et légumes le soir</small></span>
      <input id="leger" type="checkbox" data-check="soirLeger" ${f.soirLeger ? 'checked' : ''}></label>
      ${f.soirLeger && f.midi === 'non' ? '<p class="note">Sans midis prévus en semaine, la viande et le poisson ne seront servis que le week-end. Choisis « Gamelle » ou « À la maison » pour les répartir sur la semaine.</p>' : ''}</div>`;
  }
  h += `<div class="spacer"></div><p class="error" role="alert">${esc(error)}</p>

        ${(f.cuisines || []).length ? (f.cuisines.map(id => `<span class="tag">${CUISINES.find(c => c.id === id).t}</span>`).join('') + (f.cuisineStrict ? '<span class="tag">Uniquement</span>' : '')) : '<span class="tag">Toutes cuisines</span>'}</div>
        <button class="link" style="align-self:flex-start" data-act="foyer">Modifier</button></div>
      <div class="actions">${S.plan ? `<button class="btn" data-act="menus">Voir les menus de la semaine</button><button class="btn ghost" data-act="courses">Liste de courses</button>` : `<button class="btn" data-act="regen">Générer les menus de la semaine</button>`}</div>`
      : `<div class="actions"><button class="btn" data-act="foyer">Régler budget et cuisine</button></div>`}

      : `<button class="btn text" data-act="ask-reset">Tout effacer</button>`}`;
}

function render(){
  const root = document.getElementById('app');
  let h = '';
  if(view.name === 'person') h = renderPersonStep();
  else if(view.name === 'recap') h = renderRecap();
  else if(view.name === 'foyer') h = renderFoyer();
  else if(view.name === 'menus') h = renderMenus();
  else if(view.name === 'courses') h = renderCourses();
  else if(view.name === 'library') h = renderLibrary();
  else h = renderHome();
  root.innerHTML = h;
}

/* ---------- Validation ---------- */
function validatePerson(){
  const p = view.draft, id = stepsFor(p)[view.step];
  if(id === 'identite' && !p.prenom.trim()) return 'Indique un prénom pour continuer.';
  if(id === 'corps'){
    const a = age(p.naissance);
    if(a === null) return 'Indique la date de naissance.';
    if(a < 0 || a > 110) return 'La date de naissance semble incorrecte.';
    if(p.type === 'adulte' && a < 18) return 'Moins de 18 ans : reviens en arrière et choisis « Un enfant ».';
    if(p.type === 'enfant' && a >= 18) return 'Cette personne a 18 ans ou plus : choisis « Un adulte ».';
    if(p.type === 'adulte'){
      const t = +String(p.taille).replace(',','.'), w = +String(p.poids).replace(',','.');
      if(!(t >= 120 && t <= 230)) return 'Indique une taille entre 120 et 230 cm.';
      if(!(w >= 30 && w <= 250)) return 'Indique un poids entre 30 et 250 kg.';
      p.taille = String(t); p.poids = String(w);
    }
  }
  if(id === 'objectif' && p.objectif === 'perte'){ const i = imc(p); if(i !== null && i < 20) return 'Choisis un autre objectif.'; }
  return '';
}

const STEPS = {
  'curry-poulet':["Faire revenir l'oignon émincé dans l'huile, ajouter le poulet en morceaux et le colorer.","Ajouter les épices (curry), la courgette en dés et le lait de coco. Laisser mijoter 15 min.","Pendant ce temps, cuire le riz.","Servir le curry sur le riz."],
  'bolo':["Faire revenir l'oignon et la carotte hachés dans l'huile.","Ajouter le bœuf haché et le faire dorer en l'émiettant.","Verser les tomates concassées, saler, poivrer et laisser mijoter 20 min.","Cuire les pâtes, égoutter et servir avec la sauce."],
  'dahl':["Faire revenir l'oignon avec les épices (curry, cumin).","Ajouter les lentilles rincées, les tomates et le lait de coco, puis couvrir d'eau à hauteur.","Cuire 20 à 25 min, jusqu'à ce que les lentilles soient fondantes. Ajouter les épinards les 5 dernières minutes.","Servir avec le riz."],
  'saumon-four':["Préchauffer le four à 200 °C. Couper les pommes de terre en quartiers, les huiler et les enfourner 15 min.","Ajouter le saumon sur la plaque, arroser de citron, saler, poivrer, et cuire encore 12 à 15 min.","Cuire les haricots verts 10 min à l'eau bouillante ou à la vapeur.","Servir avec un filet d'huile d'olive."],
  'tortilla':["Couper les pommes de terre en fines tranches et l'oignon en lamelles.","Les cuire doucement 15 min à la poêle dans l'huile, jusqu'à ce qu'ils soient tendres.","Battre les œufs, y mélanger les pommes de terre, remettre dans la poêle et cuire à feu doux 8 min.","Retourner l'omelette à l'aide d'une assiette, cuire 3 min. Servir avec la salade."],
  'chili-sin':["Faire revenir l'oignon et le poivron en dés.","Ajouter les épices (cumin, paprika), les haricots rouges égouttés et les tomates.","Laisser mijoter 20 min à couvert.","Servir avec le riz."],
  'chili-con':["Faire revenir l'oignon et le poivron, puis le bœuf haché.","Ajouter les épices, les tomates et les haricots rouges égouttés.","Laisser mijoter 25 min.","Servir avec le riz."],
  'gratin-cf':["Préchauffer le four à 200 °C. Cuire les bouquets de chou-fleur 10 min à l'eau salée.","Préparer une béchamel : fondre le beurre, ajouter une cuillère de farine, puis le lait en fouettant jusqu'à épaississement.","Disposer le chou-fleur et le jambon en morceaux dans un plat, napper de béchamel et parsemer de fromage.","Gratiner 20 min."],
  'quiche':["Préchauffer le four à 180 °C et étaler la pâte dans un moule.","Faire dorer les lardons à sec et les répartir sur la pâte.","Battre les œufs avec la crème, saler, poivrer, verser et parsemer de fromage.","Cuire 35 min. Servir avec la salade."],
  'cabillaud':["Cuire le riz.","Cuire le brocoli 8 min à la vapeur.","Cuire le cabillaud 4 min de chaque côté à la poêle avec l'huile (ou 12 min au four à 200 °C).","Arroser de citron et servir."],
  'soupe':["Émincer les poireaux, éplucher et couper les carottes et les pommes de terre.","Couvrir d'eau avec le bouillon et cuire 25 min, puis mixer.","Parsemer les tranches de pain de fromage et les passer 5 min sous le gril.","Servir la soupe avec les tartines."],
  'wraps':["Couper le poulet en lanières et le faire dorer 8 min à la poêle, saler, poivrer.","Mélanger le yaourt avec du sel, du poivre et un peu de citron.","Garnir les tortillas de salade, tomate, concombre, poulet et sauce.","Rouler et servir."],
  'pates-thon':["Cuire les pâtes.","Faire revenir l'oignon dans l'huile, ajouter les tomates et laisser réduire 10 min.","Ajouter le thon émietté hors du feu.","Mélanger avec les pâtes."],
  'cantonais':["Cuire le riz, idéalement la veille : il sera plus facile à faire sauter.","Faire une omelette fine et la couper en lanières.","Faire revenir l'oignon, les petits pois et le jambon en dés, ajouter le riz et la sauce soja.","Ajouter l'omelette, mélanger et servir chaud."],
  'shakshuka':["Faire revenir l'oignon et le poivron en lanières 10 min.","Ajouter les tomates et les épices (cumin, paprika), laisser réduire 10 min.","Creuser des puits, y casser les œufs, couvrir et cuire 6 à 8 min.","Servir dans la poêle."],
  'salade-pc':["Cuire le quinoa 12 min, l'égoutter et le laisser tiédir.","Couper les tomates et le concombre en dés, égoutter les pois chiches.","Mélanger avec la feta émiettée.","Assaisonner avec l'huile, le citron, du sel et du poivre."],
  'lasagnes':["Préparer une bolognaise : oignon, bœuf haché et tomates, 20 min à feu doux.","Préparer une béchamel avec le beurre, un peu de farine et le lait.","Alterner dans un plat : feuilles, bolognaise, béchamel. Finir par la béchamel et le fromage.","Cuire 40 min au four à 180 °C."],
  'poulet-roti':["Préchauffer le four à 200 °C.","Disposer les cuisses, les pommes de terre et les carottes en morceaux dans un plat avec l'ail, l'huile, du sel et du poivre.","Cuire 45 min en arrosant à mi-cuisson.","Servir bien doré."],
  'tofu':["Cuire le riz.","Couper le tofu en dés et le faire dorer dans l'huile.","Ajouter les légumes en morceaux et les faire sauter 6 à 8 min : ils doivent rester croquants.","Ajouter la sauce soja, mélanger et servir avec le riz."],
  'curry-pc':["Faire revenir l'oignon avec les épices.","Ajouter les tomates, le lait de coco et les pois chiches égouttés, mijoter 15 min.","Ajouter les épinards et cuire 5 min.","Servir avec le riz."],
  'butternut':["Préchauffer le four à 200 °C. Couper la butternut en cubes, l'huiler et la rôtir 30 min.","Cuire le quinoa 12 min.","Mélanger le quinoa et la butternut, parsemer de feta.","Servir avec la salade."],
  'dinde':["Cuire les pâtes.","Faire dorer la dinde en lanières dans l'huile, réserver.","Faire revenir les champignons émincés, ajouter la crème et remettre la dinde 5 min.","Servir avec les pâtes."],
  'sardines':["Cuire les pommes de terre 20 min à la vapeur ou à l'eau.","Égoutter les sardines.","Couper les pommes de terre et les assaisonner encore chaudes d'huile et de citron.","Servir avec les sardines et la salade."],
  'pizza':["Préchauffer le four à 240 °C.","Étaler la pâte et la couvrir de tomates concassées.","Ajouter les légumes émincés et la mozzarella.","Cuire 12 à 15 min."],
  'parmentier':["Cuire les pommes de terre 20 min, les écraser en purée avec le lait et le beurre.","Faire revenir l'oignon et le bœuf haché, saler, poivrer.","Mettre la viande dans un plat, couvrir de purée et de fromage.","Gratiner 20 min à 200 °C."],
  'ratatouille':["Couper tous les légumes en dés.","Faire revenir l'oignon, puis ajouter le poivron, l'aubergine, la courgette et la tomate. Mijoter 30 min.","Cuire les œufs au plat.","Servir les œufs sur la ratatouille."],
  'lentilles-porc':["Faire dorer l'échine en morceaux dans une cocotte.","Ajouter l'oignon et les carottes, puis les lentilles rincées.","Couvrir d'eau avec le bouillon et cuire 30 min à couvert.","Rectifier l'assaisonnement et servir."],
  'gratin-pates':["Préchauffer le four à 200 °C.","Cuire les pâtes et le brocoli ensemble dans la même eau, 3 min de moins que le temps indiqué.","Égoutter, mélanger avec la crème dans un plat, parsemer de fromage.","Gratiner 15 min."],
  'nouilles':["Cuire les nouilles et les égoutter.","Faire sauter le poulet en lanières dans l'huile très chaude.","Ajouter les carottes et le poivron en julienne, sauter 4 min.","Ajouter les nouilles et la sauce soja, mélanger et servir."],
  'crevettes':["Cuire le riz.","Faire sauter les légumes 5 min dans l'huile très chaude.","Ajouter les crevettes et la sauce soja, cuire 3 min.","Servir avec le riz."],
  'curry-vert':["Cuire le riz.","Faire dorer le tofu en dés.","Ajouter la courgette, le poivron, les épices (pâte de curry vert) et le lait de coco, mijoter 10 min.","Servir sur le riz."],
  'risotto':["Faire revenir l'oignon dans le beurre, ajouter le riz et le nacrer 2 min.","Ajouter le bouillon chaud louche par louche, en remuant, pendant 18 min.","À mi-cuisson, ajouter les champignons poêlés.","Hors du feu, ajouter le parmesan et servir aussitôt."],
  'minestrone':["Couper tous les légumes en petits dés.","Les faire revenir quelques minutes, ajouter les tomates et couvrir d'eau avec le bouillon.","Cuire 20 min, ajouter les pâtes et les haricots et cuire encore 10 min.","Servir avec un filet d'huile d'olive."],
  'couscous':["Faire revenir l'oignon avec les épices (ras-el-hanout).","Ajouter les carottes, les courgettes et les tomates, couvrir d'eau et cuire 30 min.","Ajouter les pois chiches 10 min avant la fin.","Préparer la semoule à l'eau bouillante salée et servir avec le bouillon de légumes."],
  'taboule':["Verser la semoule dans un saladier, la couvrir du même volume d'eau bouillante salée et laisser gonfler 5 min.","Cuire le poulet à la poêle et le couper en dés.","Ajouter à la semoule égrainée les tomates et le concombre en dés, le citron et l'huile.","Mélanger avec le poulet et garder au frais."],
  'quesadillas':["Écraser grossièrement les haricots rouges égouttés.","Les étaler sur une tortilla, ajouter le poivron, la tomate et le fromage, couvrir d'une autre tortilla.","Dorer 3 min de chaque côté à la poêle.","Couper en parts et servir."],
  'nicoise':["Cuire les œufs 9 min (durs), les pommes de terre 20 min et les haricots verts 10 min.","Laisser refroidir puis couper en morceaux.","Disposer sur la salade avec les tomates, le thon et les olives.","Assaisonner d'huile, de sel et de poivre."],
  'cesar':["Faire dorer le poulet à la poêle et le couper en lanières.","Faire griller des croûtons de pain à la poêle.","Mélanger le yaourt, le citron, le parmesan, du sel et du poivre pour la sauce.","Assembler la salade, le poulet, les croûtons et la sauce."],
  'salade-lentilles':["Cuire les lentilles 20 min avec la carotte en dés, égoutter.","Cuire les œufs 6 min (mollets), les écaler sous l'eau froide.","Assaisonner les lentilles tièdes avec l'oignon émincé, l'huile, du sel et du poivre.","Servir sur la salade avec les œufs."],
  'grecque':["Couper les tomates et le concombre en gros morceaux, l'oignon en fines lamelles.","Ajouter les olives et la feta en dés.","Arroser d'huile d'olive, saler peu (la feta est salée) et poivrer.","Servir frais."],
  'chevre':["Couper le pain en tranches et le chèvre en rondelles.","Poser le chèvre sur le pain et passer 5 min sous le gril du four.","Préparer la salade et les tomates avec une vinaigrette.","Déposer les toasts chauds sur la salade."],
  'hiver':["Cuire les œufs 9 min et les écaler.","Râper les carottes, couper la betterave en dés.","Disposer sur la salade avec les œufs en quartiers et le fromage.","Assaisonner d'une vinaigrette."],
  'veloute-butternut':["Éplucher et couper la butternut en cubes, émincer l'oignon.","Couvrir d'eau avec le bouillon et cuire 20 min.","Mixer avec la crème.","Servir avec la salade et le fromage."],
  'omelette':["Faire revenir les champignons émincés dans l'huile.","Battre les œufs, saler, poivrer, verser sur les champignons.","Cuire à feu doux, ajouter le fromage et plier l'omelette.","Servir avec la salade."],
  'gratin-courgettes':["Préchauffer le four à 200 °C. Couper les courgettes en rondelles et les faire revenir 10 min pour qu'elles rendent leur eau.","Battre l'œuf avec la crème, du sel et du poivre.","Mettre les courgettes dans un plat, verser le mélange, parsemer de fromage.","Cuire 25 min."],
  'veloute-cf':["Cuire le chou-fleur en bouquets 20 min dans l'eau avec le bouillon.","Mixer avec le lait.","Cuire les œufs 6 min (mollets) et les écaler.","Servir le velouté avec un œuf dans chaque bol."],
  'bouillon-asie':["Porter à ébullition de l'eau avec le bouillon et la sauce soja.","Ajouter les légumes émincés finement et cuire 8 min.","Ajouter le tofu en dés et chauffer 2 min.","Servir bien chaud."],
  'cf-roti':["Préchauffer le four à 210 °C. Couper le chou-fleur en bouquets, le mélanger avec l'huile et les épices.","Rôtir 30 min en retournant à mi-cuisson.","Pour le raïta, mélanger le yaourt avec le concombre râpé, du sel et du poivre.","Servir le chou-fleur avec le raïta."],
  'mexicaine':["Couper l'avocat, les tomates et le poivron en dés.","Égoutter le maïs.","Mélanger avec la salade.","Assaisonner avec le citron, l'huile, du sel et du poivre."],
  'caprese':["Couper la courgette et l'aubergine en tranches, les huiler et les griller 4 min par face.","Couper les tomates et la mozzarella en tranches.","Les alterner sur l'assiette avec les légumes grillés.","Arroser d'huile d'olive, saler, poivrer."],
  'blanquette':["Faire revenir la dinde en morceaux sans la colorer, ajouter les carottes et l'oignon.","Couvrir d'eau avec le bouillon et cuire 40 min à feu doux. Ajouter les champignons pour les 10 dernières minutes.","Prélever un peu de bouillon, le mélanger à la crème et reverser dans la cocotte.","Servir avec le riz."],
  'boeuf-carottes':["Faire dorer le bœuf en morceaux dans une cocotte.","Ajouter l'oignon et les carottes en rondelles, couvrir d'eau avec le bouillon.","Cuire 2 h à feu très doux (ou 40 min en cocotte-minute).","Ajouter les pommes de terre 30 min avant la fin (10 min en cocotte-minute)."],
  'saucisse-lentilles':["Faire dorer les saucisses dans une cocotte.","Ajouter l'oignon et les carottes, puis les lentilles rincées.","Couvrir d'eau avec le bouillon et cuire 30 min.","Servir bien chaud."],
  'cassoulet':["Utiliser des haricots blancs en conserve, ou les faire tremper une nuit puis les cuire 1 h.","Faire dorer les saucisses en tronçons avec l'oignon et la carotte.","Ajouter les haricots, les tomates et l'ail, mijoter 30 min.","Passer 15 min au four à 180 °C pour former une croûte."],
  'tartiflette':["Cuire les pommes de terre 20 min et les couper en rondelles.","Faire revenir les lardons et l'oignon.","Alterner dans un plat les pommes de terre, les lardons et la crème, puis poser le reblochon coupé en deux.","Cuire 25 min à 200 °C. Servir avec la salade."],
  'croque':["Beurrer les tranches de pain de mie.","Garnir de jambon et de fromage, refermer.","Dorer 4 min de chaque côté à la poêle, ou 10 min au four à 200 °C.","Servir avec la salade."],
  'galette-complete':["Chauffer une poêle légèrement beurrée et y poser une galette.","Casser un œuf au centre, ajouter le jambon et le fromage autour.","Quand le blanc est pris, replier les bords en carré.","Servir avec la salade."],
  'basquaise':["Faire dorer les cuisses de poulet dans une cocotte, réserver.","Faire revenir l'oignon et les poivrons en lanières.","Ajouter les tomates, remettre le poulet et mijoter 30 min.","Servir avec le riz."],
  'pot-au-feu':["Mettre le bœuf dans une grande cocotte, couvrir d'eau froide avec le bouillon et porter à ébullition en écumant.","Cuire 2 h à petit feu (ou 45 min en cocotte-minute).","Ajouter les carottes, les poireaux et les navets, puis les pommes de terre 30 min avant la fin.","Servir la viande et les légumes, avec le bouillon en entrée."],
  'dauphinois':["Préchauffer le four à 180 °C. Couper les pommes de terre en fines rondelles.","Les disposer dans un plat frotté à l'ail, verser le lait et la crème salés et poivrés.","Cuire 50 min.","Pendant ce temps, cuire les escalopes 4 min de chaque côté à la poêle."],
  'endives-jambon':["Cuire les endives 15 min à la vapeur et bien les égoutter.","Préparer une béchamel avec le beurre, un peu de farine et le lait.","Rouler chaque endive dans une tranche de jambon, napper de béchamel et de fromage.","Gratiner 20 min à 200 °C."],
  'colin-poireaux':["Cuire le riz.","Émincer les poireaux et les faire fondre 15 min à feu doux avec un peu d'eau, puis ajouter la crème.","Poser le colin sur les poireaux, couvrir et cuire 8 min.","Servir avec le riz."],
  'moules':["Couper les pommes de terre en frites, les huiler et les cuire 30 min au four à 220 °C.","Gratter et rincer les moules, jeter celles qui restent ouvertes.","Faire revenir l'oignon, ajouter les moules, couvrir et cuire 5 min à feu vif jusqu'à ce qu'elles s'ouvrent.","Ajouter la crème, mélanger et servir avec les frites."],
  'parmentier-patate':["Cuire les patates douces 20 min, les écraser avec le lait et le beurre.","Cuire le poulet à la poêle et le couper en petits dés.","Mettre le poulet dans un plat, couvrir de purée et de fromage.","Gratiner 20 min à 200 °C."],
  'quiche-poireaux':["Préchauffer le four à 180 °C, étaler la pâte dans un moule.","Faire fondre les poireaux émincés 10 min.","Battre l'œuf et la crème, ajouter les poireaux, verser sur la pâte et disposer le chèvre.","Cuire 35 min."],
  'pois-casses':["Rincer les pois cassés.","Faire revenir l'oignon et les carottes, ajouter les pois et couvrir largement d'eau avec le bouillon.","Cuire 45 min à feu doux.","Mixer et servir."],
  'magret':["Quadriller la peau du magret et le cuire côté peau 8 min à feu moyen, puis 4 min côté chair.","Laisser reposer 5 min sous une feuille d'aluminium.","Faire sauter les pommes de terre en rondelles 20 min dans un peu de graisse du magret, avec l'ail.","Trancher le magret et servir."],
  'boudin':["Cuire les pommes de terre et les écraser en purée avec le lait et le beurre.","Couper les pommes en quartiers et les dorer 10 min à la poêle.","Cuire le boudin 10 min à feu doux dans la même poêle.","Servir avec la purée et les pommes."],
  'poulet-moutarde':["Cuire le riz et les haricots verts.","Faire dorer le poulet en morceaux.","Ajouter la crème et la moutarde, mijoter 5 min.","Servir avec le riz et les haricots."],
  'veloute-poireaux':["Émincer les poireaux et les faire revenir 5 min.","Couvrir d'eau avec le bouillon, cuire 20 min et mixer avec la crème.","Pocher les œufs 3 min dans de l'eau frémissante vinaigrée.","Servir un œuf dans chaque bol."],
  'salade-endives':["Émincer les endives, couper la pomme en dés.","Ajouter les noix et le fromage en dés.","Assaisonner d'une vinaigrette.","Servir aussitôt."],
  'soupe-legumes':["Éplucher et couper tous les légumes.","Couvrir d'eau avec le bouillon et cuire 30 min.","Mixer.","Servir avec le fromage blanc."],
  'piperade':["Faire revenir l'oignon et les poivrons en lanières 15 min.","Ajouter les tomates en dés et cuire 10 min.","Casser les œufs dans la poêle et les brouiller doucement.","Servir aussitôt."],
  'tian':["Préchauffer le four à 180 °C.","Couper la courgette, la tomate et l'aubergine en rondelles fines.","Les disposer en rangs serrés dans un plat, arroser d'huile, saler, poivrer.","Cuire 45 min, ajouter le chèvre les 10 dernières minutes."],
  'carbonara':["Cuire les pâtes.","Faire dorer les lardons à sec.","Battre l'œuf avec le parmesan et beaucoup de poivre.","Hors du feu, mélanger les pâtes, les lardons et l'œuf avec un peu d'eau de cuisson, sans recuire."],
  'pesto':["Cuire les pâtes avec les haricots verts coupés en tronçons dans la même eau.","Égoutter en gardant un peu d'eau de cuisson.","Mélanger avec le pesto et un peu d'eau.","Servir avec le parmesan."],
  'gnocchi':["Faire chauffer les tomates 10 min avec un peu d'huile, du sel et du poivre.","Cuire les gnocchis dans l'eau bouillante : ils sont prêts quand ils remontent.","Mélanger avec la sauce dans un plat, ajouter la mozzarella.","Gratiner 10 min à 220 °C."],
  'parmigiana-poulet':["Préchauffer le four à 200 °C. Faire dorer le poulet à la poêle.","Le mettre dans un plat, couvrir de tomates, de mozzarella et de parmesan.","Cuire 20 min.","Servir avec les pâtes."],
  'polenta':["Faire dorer les champignons émincés à la poêle.","Porter à ébullition 4 fois le volume de polenta en eau salée, verser la polenta en pluie en remuant.","Cuire 5 min, ajouter la crème et le parmesan.","Servir la polenta avec les champignons."],
  'cannelloni':["Cuire les épinards, bien les presser et les hacher. Les mélanger avec la ricotta, du sel et du poivre.","Cuire les feuilles de lasagne 3 min, les garnir et les rouler.","Disposer dans un plat, couvrir de tomates et de fromage.","Cuire 30 min au four à 180 °C."],
  'frittata':["Faire revenir la courgette et le poivron en dés.","Battre les œufs avec le parmesan, du sel et du poivre, verser sur les légumes.","Cuire à feu doux 10 min à couvert.","Finir 3 min sous le gril du four."],
  'pates-saumon':["Cuire les pâtes.","Faire fondre les épinards dans une poêle.","Ajouter la crème et le saumon en dés, cuire 5 min.","Mélanger avec les pâtes."],
  'arrabbiata':["Faire revenir l'ail et une pincée de piment dans l'huile.","Ajouter les tomates et laisser réduire 15 min.","Cuire les pâtes.","Mélanger et servir avec le parmesan."],
  'pizza-reine':["Préchauffer le four à 240 °C.","Étaler la pâte et la couvrir de tomates.","Ajouter le jambon, les champignons émincés et la mozzarella.","Cuire 12 à 15 min."],
  'aubergines-parmesane':["Couper les aubergines en tranches, les huiler et les rôtir 20 min à 200 °C.","Alterner dans un plat les aubergines, les tomates et la mozzarella.","Parsemer de parmesan.","Cuire 30 min à 180 °C."],
  'falafels':["Mixer les pois chiches (trempés une nuit, crus) avec les épices, du sel et des herbes si vous en avez.","Former des boulettes et les dorer à la poêle dans l'huile, 3 min par face.","Mélanger le yaourt avec du sel et un peu de citron.","Servir dans les pitas avec la tomate, le concombre et la sauce."],
  'tajine':["Faire dorer les cuisses avec l'oignon et les épices (ras-el-hanout, cumin).","Ajouter les carottes et les courgettes, un verre d'eau, et couvrir.","Cuire 45 min à feu doux.","Servir avec la semoule."],
  'kefta':["Mélanger le bœuf haché avec l'oignon haché et les épices, former des boulettes.","Les dorer à la poêle.","Ajouter les tomates et les courgettes en dés, mijoter 20 min.","Servir avec la semoule."],
  'houmous-bowl':["Rôtir le poivron et la courgette en morceaux 25 min à 200 °C.","Cuire le boulgour 10 min.","Mixer les pois chiches avec le tahini, du citron, un peu d'eau et du sel pour faire le houmous.","Assembler le boulgour, les légumes et le houmous dans les bols."],
  'moussaka':["Couper les aubergines en tranches, les huiler et les rôtir 20 min à 200 °C.","Faire revenir l'oignon et le bœuf, ajouter les tomates et mijoter 15 min.","Préparer une béchamel avec le beurre, un peu de farine et le lait.","Alterner les aubergines et la viande, couvrir de béchamel et de fromage, cuire 40 min à 180 °C."],
  'paella':["Faire dorer le poulet et le chorizo en morceaux.","Ajouter le poivron, les tomates et le riz, mélanger 2 min.","Verser 2,5 fois le volume du riz en eau chaude avec les épices (paprika, safran) et cuire 20 min sans remuer.","Ajouter les petits pois 5 min avant la fin."],
  'couscous-merguez':["Faire dorer le poulet avec les épices, ajouter les légumes et couvrir d'eau. Cuire 45 min.","Ajouter les pois chiches les 10 dernières minutes.","Griller les merguez à la poêle.","Préparer la semoule et servir avec le bouillon, les légumes et les viandes."],
  'mujaddara':["Cuire les lentilles 15 min, ajouter le riz et cuire encore 15 min.","Pendant ce temps, faire frire doucement les oignons émincés dans l'huile jusqu'à ce qu'ils soient bien bruns.","Mélanger les lentilles, le riz et la moitié des oignons.","Servir avec le reste des oignons et le yaourt."],
  'soupe-corail':["Faire revenir l'oignon et la carotte avec le cumin.","Ajouter les lentilles rincées et couvrir largement d'eau avec le bouillon.","Cuire 20 min et mixer.","Servir avec un filet de citron."],
  'fattouche':["Couper la pita en morceaux et la faire griller à la poêle.","Couper les tomates et le concombre, ciseler les herbes.","Mélanger avec la salade et la feta.","Assaisonner d'huile et de citron, ajouter le pain au dernier moment."],
  'baba-ganoush':["Rôtir les aubergines entières 40 min à 220 °C, jusqu'à ce qu'elles soient fondantes.","Récupérer la chair et l'écraser avec le tahini, le citron et du sel.","Couper les carottes et le concombre en bâtonnets.","Servir avec la feta."],
  'gaspacho':["Cuire les œufs 9 min.","Mixer les tomates, le concombre et le poivron avec l'huile, du sel et du poivre.","Réserver au frais au moins 1 h.","Servir bien froid avec les œufs."],
  'teriyaki':["Cuire le riz et le brocoli.","Faire dorer le poulet en morceaux.","Ajouter la sauce soja et le gingembre râpé, laisser réduire jusqu'à ce que la sauce nappe.","Servir avec le riz et le brocoli."],
  'bobun':["Faire mariner le bœuf avec la sauce soja.","Cuire les vermicelles 4 min et les rincer à l'eau froide.","Saisir le bœuf 2 min à feu vif.","Disposer dans les bols la salade, les vermicelles, la carotte et le concombre râpés, le bœuf, les herbes et les cacahuètes concassées."],
  'pad-thai':["Faire tremper les nouilles de riz 10 min dans l'eau chaude.","Faire sauter les crevettes, ajouter l'œuf battu et le brouiller.","Ajouter les nouilles, la carotte râpée et la sauce soja, sauter 3 min.","Servir avec les cacahuètes et le citron."],
  'ramen':["Faire dorer l'échine en tranches.","Porter à ébullition de l'eau avec le bouillon et la sauce soja, ajouter les poireaux et les champignons.","Cuire les œufs 6 min et les nouilles 3 min.","Dans les bols : nouilles, bouillon, porc et œuf coupé en deux."],
  'rouleaux':["Cuire les vermicelles et les crevettes.","Tremper une galette de riz quelques secondes dans l'eau tiède.","Garnir de salade, de carotte râpée, de vermicelles, de crevettes et d'herbes, puis rouler serré.","Servir avec de la sauce soja."],
  'poke':["Cuire le riz et le laisser tiédir.","Couper le saumon en dés (très frais), ou le cuire 10 min si vous préférez.","Couper l'avocat, le concombre et la carotte.","Disposer dans les bols et arroser de sauce soja."],
  'porc-caramel':["Couper l'échine en morceaux.","Faire un caramel avec une cuillère de sucre, ajouter le porc et l'oignon.","Ajouter la sauce soja et un verre d'eau, mijoter 30 min.","Servir avec le riz."],
  'miso':["Faire chauffer de l'eau sans la faire bouillir.","Ajouter le poireau et les champignons émincés, cuire 5 min.","Ajouter le tofu et les épinards, puis délayer la pâte miso hors du feu.","Servir aussitôt."],
  'wok-oeuf':["Faire une omelette fine, la rouler et la couper en lanières.","Faire sauter les légumes 6 min à feu vif dans l'huile.","Ajouter la sauce soja.","Servir avec l'omelette."],
  'curry-japonais':["Faire revenir l'oignon et le poulet.","Ajouter les carottes et les pommes de terre, couvrir d'eau, cuire 20 min.","Ajouter les épices (curry doux) et laisser épaissir.","Servir avec le riz."],
  'bibimbap':["Cuire le riz.","Faire sauter séparément les épinards, la carotte râpée et le bœuf avec la sauce soja.","Cuire les œufs au plat.","Disposer le riz, les légumes, le bœuf et l'œuf dans les bols ; mélanger au moment de manger."],
  'salade-thai':["Saisir le bœuf 2 min à feu vif et le trancher.","Mélanger le citron, la sauce soja et un peu d'eau pour la sauce.","Couper le concombre et les tomates, ciseler les herbes.","Mélanger la salade, les légumes, le bœuf et la sauce."],
  'butter-chicken':["Faire mariner le poulet avec une partie des épices.","Le dorer dans le beurre, ajouter les tomates et le reste des épices, mijoter 20 min.","Ajouter la crème et cuire 5 min.","Servir avec le riz."],
  'biryani':["Faire revenir l'oignon avec les épices.","Ajouter le riz, les légumes et 2 fois le volume du riz en eau.","Cuire 15 min à couvert, puis laisser reposer 5 min.","Servir avec le yaourt."],
  'tikka':["Faire mariner le poulet dans le yaourt et les épices, au moins 30 min si possible.","Le cuire à la poêle, ou 15 min au four à 220 °C.","Couper le concombre et l'assaisonner.","Servir avec le naan chaud."],
  'aloo-gobi':["Faire revenir l'oignon avec les épices (curcuma, cumin).","Ajouter les pommes de terre en dés et le chou-fleur en bouquets.","Ajouter les tomates et un peu d'eau, couvrir et cuire 25 min.","Servir chaud."],
  'korma':["Faire revenir les épices dans un peu d'huile.","Ajouter la courgette et le chou-fleur en morceaux, le lait de coco et un peu d'eau.","Cuire 15 min, ajouter les épinards 3 min.","Servir chaud."],
  'curry-poisson':["Cuire le riz.","Faire chauffer les tomates avec le lait de coco et les épices 10 min.","Ajouter le poisson en morceaux et les épinards, cuire 6 min sans trop remuer.","Servir avec le riz."],
  'tacos':["Faire revenir le bœuf avec les épices.","Couper les tomates et l'oignon en petits dés pour la salsa, saler.","Chauffer les tortillas à la poêle.","Garnir de bœuf, de salsa et de salade."],
  'burrito-bowl':["Cuire le riz.","Cuire le poulet en morceaux avec des épices.","Chauffer les haricots rouges et le maïs.","Disposer dans les bols avec la tomate, l'avocat et la salade."],
  'fajitas':["Faire sauter le poulet en lanières avec les épices.","Ajouter les poivrons et l'oignon émincés, cuire 8 min.","Chauffer les tortillas.","Garnir et servir avec le yaourt."],
  'enchiladas':["Écraser grossièrement les haricots avec le maïs.","Garnir et rouler les tortillas, les placer dans un plat.","Napper de tomates et de fromage.","Cuire 20 min à 200 °C."],
  'patate-farcie':["Cuire les patates douces entières 45 min au four à 200 °C.","Faire chauffer les haricots, le maïs, les tomates et les épices 10 min.","Ouvrir les patates en deux et les garnir.","Parsemer de fromage et repasser 5 min au four."],
  'salade-quinoa-mex':["Cuire le quinoa et le laisser refroidir.","Égoutter les haricots et le maïs, couper le poivron et la tomate.","Mélanger le tout.","Assaisonner avec le citron, l'huile, du sel et du poivre."],
  'mafe':["Faire dorer les cuisses avec l'oignon.","Ajouter les tomates, les carottes et la patate douce, couvrir d'eau.","Délayer le beurre de cacahuète dans un peu de bouillon, l'ajouter et mijoter 40 min.","Servir avec le riz."],
  'yassa':["Faire mariner le poulet avec le citron, la moutarde et les oignons émincés (idéalement quelques heures).","Faire dorer le poulet et le réserver.","Faire fondre les oignons de la marinade 20 min, remettre le poulet et la marinade, mijoter 25 min.","Servir avec le riz."],
  'thieb':["Faire revenir l'oignon, ajouter les tomates et couvrir largement d'eau.","Ajouter les carottes, le chou et la patate douce, cuire 20 min.","Ajouter le poisson 10 min, puis le retirer avec les légumes.","Cuire le riz 20 min dans le bouillon restant et servir avec le poisson et les légumes."],
  'rougail':["Couper les saucisses en rondelles et les dorer.","Ajouter l'oignon, le gingembre râpé et les épices (curcuma, piment doux).","Ajouter les tomates en dés et mijoter 25 min.","Servir avec le riz."],
  'colombo':["Faire dorer le poulet avec la poudre de colombo.","Ajouter les pommes de terre, la courgette et le lait de coco, couvrir d'eau à mi-hauteur.","Mijoter 40 min.","Servir avec le riz."],
  'salade-chou':["Cuire les œufs 9 min et les écaler.","Émincer finement le chou, râper la carotte.","Mélanger avec le yaourt, le citron, du sel et du poivre.","Servir avec les œufs coupés en deux, jaunes émiettés par-dessus."],
  'garbure':["Mettre dans une grande cocotte tous les légumes coupés en morceaux et les haricots (trempés la veille, ou en conserve).","Ajouter le jambon en dés et couvrir d'eau avec le bouillon.","Cuire 1 h 30 à feu doux.","Servir bien épais."],
  'steak-puree':["Cuire les pommes de terre 20 min, les écraser avec le lait et le beurre.","Cuire les haricots verts 10 min.","Cuire les steaks 2 à 4 min par face selon la cuisson souhaitée.","Servir ensemble."],
  'papillote':["Préchauffer le four à 200 °C et cuire le riz.","Couper la courgette et la carotte en julienne.","Sur une feuille de papier cuisson, poser les légumes, le poisson, une rondelle de citron, l'huile, du sel et du poivre. Fermer.","Cuire 15 à 20 min."],
  'brandade':["Cuire les pommes de terre 20 min.","Pocher le colin 8 min dans le lait avec l'ail.","Écraser les pommes de terre avec le poisson émietté, un peu de lait et l'huile.","Gratiner 15 min à 200 °C."],
  'saumon-lentilles':["Cuire les lentilles 20 min avec la carotte et l'oignon.","Cuire le saumon 4 min par face à la poêle, côté peau d'abord.","Assaisonner les lentilles d'un filet d'huile.","Servir le saumon sur les lentilles."],
  'oeufs-cocotte':["Préchauffer le four à 180 °C.","Faire fondre les épinards à la poêle et les répartir dans des ramequins.","Ajouter un peu de crème, casser un œuf par-dessus, saler, poivrer.","Cuire 10 à 12 min au bain-marie dans le four."],
  'tarte-tomate':["Préchauffer le four à 200 °C, étaler la pâte dans un moule.","Badigeonner le fond de moutarde.","Disposer les tomates en rondelles, parsemer de fromage, saler, poivrer.","Cuire 30 min."],
  'lyonnaise':["Faire dorer les lardons et des croûtons de pain.","Pocher les œufs 3 min dans l'eau frémissante vinaigrée.","Assaisonner la salade d'une vinaigrette.","Ajouter les lardons, les croûtons et un œuf par assiette."],
  'veloute-carottes':["Faire revenir l'oignon avec le cumin.","Ajouter les carottes en rondelles, couvrir d'eau avec le bouillon et cuire 25 min.","Mixer.","Servir avec une cuillère de fromage blanc."],
  'poireaux-vinaigrette':["Cuire les poireaux 15 min à la vapeur et les laisser tiédir.","Cuire les œufs 9 min et les écaler.","Préparer une vinaigrette à la moutarde.","Napper les poireaux de vinaigrette et émietter les œufs par-dessus."],
  'champignons-farcis':["Préchauffer le four à 200 °C. Retirer les pieds des champignons et les hacher.","Mélanger les pieds avec le fromage blanc et les herbes, saler, poivrer.","Garnir les champignons et parsemer de fromage.","Cuire 20 min. Servir avec la salade."],
  'soupe-oignon':["Émincer les oignons et les faire fondre 20 min dans le beurre, jusqu'à ce qu'ils soient dorés.","Couvrir largement d'eau avec le bouillon et cuire 20 min.","Verser dans des bols, poser une tranche de pain et le fromage.","Gratiner 5 min sous le gril."],
  'lasagnes-vege':["Faire revenir les courgettes et les aubergines en dés 10 min, ajouter les tomates.","Alterner dans un plat les feuilles de lasagne, les légumes et la ricotta.","Finir par le fromage.","Cuire 40 min à 180 °C."],
