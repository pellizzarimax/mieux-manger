function stepsOf(r){ return STEPS[r.id] || ["Suis la recette de ton choix avec les liens ci-dessous."]; }
function vegGrams(r){ let g = 0; for(const k in r.ing) if(VEG_W[k]) g += r.ing[k] * VEG_W[k]; return g; }
function hasSide(r){ return !('salade' in r.ing) && vegGrams(r) < 150; }
function mealIng(r){ if(!hasSide(r)) return r.ing; const o = {...r.ing}; for(const k in SIDE) o[k] = (o[k] || 0) + SIDE[k]; return o; }
function midiMode(f){ f = f || S.foyer; return f.midi || (f.midiMaison ? 'maison' : 'non'); }
const TYPE_LABEL = {volaille:'Volaille', viande:'Viande', charcuterie:'Charcuterie', poisson:'Poisson', oeuf:'Œufs', legumineuse:'Légumineuses', vege:'Végétarien'};
const VEGE_TYPES = ['oeuf','legumineuse','vege'];
const MEAT_TYPES = ['volaille','viande','charcuterie'];
const ALLERGEN_KEY = {'Gluten':'gluten','Lactose':'lactose','Œufs':'oeufs','Poisson':'poisson','Soja':'soja','Crustacés':'crustaces','Mollusques':'mollusques','Arachides':'arachides','Fruits à coque':'noix','Sésame':'sesame','Moutarde':'moutarde'};
const DAYS = ['Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi','Dimanche'];

/* ---------- Menus : calcul ---------- */
function norm(s){ return String(s).normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().trim().replace(/s$/,''); }
function portionsOf(p){
  const n = needs(p);
  if(n.child) return n.age === null ? 0.5 : n.pct / 100;
  return Math.min(1.4, Math.max(0.75, n.kcal / 2200));
}
function household(){
  const portions = S.people.reduce((t,p) => t + portionsOf(p), 0);
  const allergens = new Set(), words = [];
  let vege = false, flexi = false;
  S.people.forEach(p => {
    p.allergies.forEach(a => ALLERGEN_KEY[a] && allergens.add(ALLERGEN_KEY[a]));
    [p.autreAllergie, ...p.evites.split(',')].map(s => s && norm(s)).filter(Boolean).forEach(w => words.push(w));
    if(p.regime === 'vege') vege = true;
    if(p.regime === 'flexi') flexi = true;
  });
  const sucre = S.people.some(p => p.moinsSucre);
  return {portions, allergens, words, vege, flexi, sucre};
}
function cuisinePrefs(){ return S.foyer.cuisines || []; }
function cuisineOk(r){ const c = cuisinePrefs(); return !S.foyer.cuisineStrict || !c.length || c.includes(r.cuisine); }
function compatible(r, h, anyCuisine){
  if(h.vege && !VEGE_TYPES.includes(r.type)) return false;
  if(!anyCuisine && !cuisineOk(r)) return false;
  if(h.sucre && r.sweet) return false;
  for(const k in r.ing){
    const it = ING[k];
    if((it[4] || []).some(a => h.allergens.has(a))) return false;
    const n = norm(it[0]);
    if(h.words.some(w => n.includes(w) || w.includes(norm(k)))) return false;
  }
  if(h.words.some(w => norm(r.name).includes(w))) return false;
  return true;
}
function bioFactor(cat){
  const b = S.foyer.bio;
  if(b === 'max') return 1.45;
  if(b === 'cles' && cat === L) return 1.4;
  return 1;
}
function unitPrice(k){ return (S.prices && S.prices[k] != null) ? S.prices[k] : ING[k][3]; }
function lineCost(k, qty){ const it = ING[k]; const base = it[2] === 'pc' ? qty : qty / 1000; return base * unitPrice(k) * bioFactor(it[1]); }
function recipeCost(r, portions){ const ing = mealIng(r); let c = 0; for(const k in ing) c += lineCost(k, ing[k] * portions); return c; }
function slotOk(r, slot){
  if(slot.box && r.nobox) return false;
  if(S.foyer.soirLeger && slot.meal === 'soir' && !r.light) return false;
  return true;
}
function slotsOf(){
  const out = [], mode = midiMode();
  DAYS.forEach((d,i) => {
    const we = i >= 5;
    if(we || mode !== 'non') out.push({day:i, meal:'midi', box: !we && mode === 'gamelle', max:+(we ? S.foyer.tempsWeekend : S.foyer.tempsSemaine)});
    out.push({day:i, meal:'soir', max:+(we ? S.foyer.tempsWeekend : S.foyer.tempsSemaine)});
  });
  return out;
}
function capsOk(type, counts, h){
  const meat = counts.volaille + counts.viande + counts.charcuterie;
  if(MEAT_TYPES.includes(type) && meat >= (h.flexi ? 3 : 7)) return false;
  if((type === 'viande' || type === 'charcuterie') && counts.viande + counts.charcuterie >= 3) return false;
  if(type === 'charcuterie' && counts.charcuterie >= 1) return false;
  if(type === 'poisson' && counts.poisson >= 3) return false;
  if(type === 'oeuf' && counts.oeuf >= (S.foyer.soirLeger ? 4 : 3)) return false;
  return true;
}
function countTypes(plan, skipIndex){
  const c = {volaille:0, viande:0, charcuterie:0, poisson:0, oeuf:0, legumineuse:0, vege:0};
  plan.forEach((m,i) => { if(i !== skipIndex && m.r) c[RECIPES.find(r => r.id === m.r).type]++; });
  return c;
}
function pick(slot, plan, index, h, exclude){
  const counts = countTypes(plan, index);
  const used = new Set(plan.filter((m,i) => i !== index && m.r).map(m => m.r));
  let pool = RECIPES.filter(r => r.min <= slot.max && compatible(r, h) && slotOk(r, slot) && r.id !== exclude);
  if(!pool.length) pool = RECIPES.filter(r => compatible(r, h) && slotOk(r, slot) && r.id !== exclude);
  if(!pool.length) pool = RECIPES.filter(r => compatible(r, h) && r.id !== exclude);
  const prefs = cuisinePrefs();
  // Alternance des styles : on évite la même cuisine qu'au repas d'avant ou d'après, et on étale
  const cuisineAt = j => { const m = plan[j]; return m && m.r ? RECIPES.find(r => r.id === m.r).cuisine : null; };
  const near = [cuisineAt(index - 1), cuisineAt(index + 1)];
  const cCount = {};
  plan.forEach((m,i) => { if(i !== index && m.r){ const c = RECIPES.find(r => r.id === m.r).cuisine; cCount[c] = (cCount[c] || 0) + 1; } });
  const fresh = pool.filter(r => !used.has(r.id));
  if(fresh.length) pool = fresh;
  const ok = pool.filter(r => capsOk(r.type, counts, h));
  if(ok.length) pool = ok;
  const scored = pool.map(r => {
    let s = Math.random();
    if(r.type === 'poisson' && counts.poisson < 2) s += 0.7;
    if(r.type === 'legumineuse' && counts.legumineuse < 2) s += 0.7;
    if(r.type === 'legumineuse' && counts.legumineuse >= 3) s -= 0.6;
    const meat = counts.volaille + counts.viande + counts.charcuterie;
    if(!h.vege && MEAT_TYPES.includes(r.type) && meat < (h.flexi ? 2 : 4)) s += 0.5;
    if(prefs.length && prefs.includes(r.cuisine)) s += 0.9;
    if(near.includes(r.cuisine)) s -= 0.8;
    s -= 0.2 * (cCount[r.cuisine] || 0);
    if(S.foyer.soirLeger && slot.meal === 'midi' && !r.light) s += 0.8;
    return {r, s};
  }).sort((a,b) => b.s - a.s);
  return scored.length ? scored[0].r.id : null;
}
function budgetTarget(){ return +S.foyer.budget * (midiMode() !== 'non' ? 0.8 : 0.65); }
function planCost(plan, h){ return plan.reduce((t,m) => t + (m.r ? recipeCost(RECIPES.find(r => r.id === m.r), h.portions) : 0), 0); }
function generate(){
  const h = household();
  const plan = slotsOf().map(s => ({...s, r:null}));
  plan.forEach((m,i) => { m.r = pick(m, plan, i, h); });
  // Ajustement au budget : on remplace le repas le plus cher par une alternative moins chère
  const target = budgetTarget();
  for(let guard = 0; guard < 30 && planCost(plan, h) > target; guard++){
    const costs = plan.map(m => m.r ? recipeCost(RECIPES.find(r => r.id === m.r), h.portions) : 0);
    const order = costs.map((c,i) => [c,i]).sort((a,b) => b[0]-a[0]);
    let swapped = false;
    for(const [c,i] of order){
      const counts = countTypes(plan, i), used = new Set(plan.map(m => m.r));
      const cheaper = RECIPES.filter(r => r.min <= plan[i].max && compatible(r,h) && slotOk(r, plan[i]) && !used.has(r.id) && capsOk(r.type, counts, h) && recipeCost(r, h.portions) < c - 0.5)
        .sort((a,b) => recipeCost(a,h.portions) - recipeCost(b,h.portions));
      if(cheaper.length){ plan[i].r = cheaper[Math.floor(Math.random() * Math.min(3, cheaper.length))].id; swapped = true; break; }
    }
    if(!swapped) break;
  }
  // Au moins un plat à découvrir par semaine (si l'option est active)
  if(S.foyer.decouverte !== false && !plan.some(m => m.r && RECIPES.find(r => r.id === m.r).discover)){
    const used = new Set(plan.map(m => m.r));
    const order = plan.map((m,i) => i).sort((a,b) => (plan[b].day >= 5) - (plan[a].day >= 5) || Math.random() - 0.5);
    for(const i of order){
      const counts = countTypes(plan, i), cur = plan[i].r && recipeCost(RECIPES.find(r => r.id === plan[i].r), h.portions);
      const cands = RECIPES.filter(r => r.discover && !used.has(r.id) && r.min <= plan[i].max && compatible(r,h) && slotOk(r, plan[i]) && capsOk(r.type, counts, h)
        && planCost(plan, h) - (cur || 0) + recipeCost(r, h.portions) <= Math.max(target, planCost(plan, h)));
      if(cands.length){ plan[i].r = cands[Math.floor(Math.random() * cands.length)].id; break; }
    }
  }
  S.plan = plan; S.checked = {}; save();
}
function shopping(){
  const h = household(), tot = {};
  (S.plan || []).forEach(m => { if(!m.r) return; const ing = mealIng(RECIPES.find(x => x.id === m.r)); for(const k in ing) tot[k] = (tot[k] || 0) + ing[k] * h.portions; });
  return tot;
}
function fmtQty(k, q){
  const u = ING[k][2];
  if(u === 'pc') return Math.max(1, Math.ceil(q - 0.05)) + (k === 'oeuf' ? ' œufs' : ' pc');
  if(q >= 1000) return (Math.round(q / 100) / 10).toLocaleString('fr-FR') + (u === 'g' ? ' kg' : ' l');
  return Math.ceil(q / 10) * 10 + (u === 'g' ? ' g' : ' ml');
}
function euros(n){ return n.toLocaleString('fr-FR', {minimumFractionDigits:2, maximumFractionDigits:2}) + ' €'; }
function unitLabel(k){ const u = ING[k][2]; return u === 'g' ? '€/kg' : u === 'ml' ? '€/l' : '€/pièce'; }

/* ---------- Menus : rendu ---------- */
function renderMenus(){
  const h = household(), plan = S.plan || [];
  const total = planCost(plan, h), target = budgetTarget(), budget = +S.foyer.budget;
  const c = countTypes(plan, -1);
  const redMeat = c.viande + c.charcuterie;
  const rep = [
    ['Poisson', c.poisson, c.poisson >= 2, '2 fois / sem.'],
    ['Légumineuses', c.legumineuse, c.legumineuse >= 2, '2 fois min.'],
    ['Viande rouge, charcuterie', redMeat, redMeat <= 3, '3 fois max.']
  ];
  const overs = total > target;
  let html = `<div class="top"><button class="icon-btn" aria-label="Retour" data-act="home">${icons.back}</button><span class="count" style="flex:1">Semaine</span>
    <button class="link" data-act="regen">Nouvelle semaine</button></div>`;
  html += head('Menus', 'La semaine du foyer', `${fmt(plan.length)} repas pour ${h.portions.toLocaleString('fr-FR', {maximumFractionDigits:1})} portions adultes par repas.`);
  html += `<div class="body">
    <div class="hero"><div class="row"><small>Coût estimé des repas</small><small>Budget ${euros(budget)}</small></div>
      <div class="big"><b>${fmt(total)} €</b><span>/ semaine</span></div>
      <small>${overs ? 'Au-dessus de la part prévue pour ces repas (' + fmt(target) + ' €). Change les plats les plus chers ou augmente le budget.' : 'Il reste environ ' + fmt(budget - total) + ' € pour les petits-déjeuners, fruits et produits de base.'}</small></div>
    <div class="card"><b style="font-size:15px">Repères de la semaine</b>
      ${rep.map(([l,n,ok,ref]) => `<div class="person" style="gap:10px"><span class="opt-t"><b style="font-size:15px">${l}</b><small>Repère : ${ref}</small></span>
        <span class="tag ${ok ? '' : 'warn'}" style="font-variant-numeric:tabular-nums">${n} ${ok ? '✓' : '!'}</span></div>`).join('')}
    </div>`;
  DAYS.forEach((d,i) => {
    const meals = plan.map((m,idx) => ({...m, idx})).filter(m => m.day === i);
    html += `<h2 class="section-title">${d}</h2><div class="card" style="gap:16px">${meals.map(m => {
      if(!m.r) return `<p class="note">Aucune recette compatible avec les contraintes du foyer.</p>`;
      const r = RECIPES.find(x => x.id === m.r);
      const open = view.open === m.idx;
      const q = encodeURIComponent(r.name);
      const mine = S.links && S.links[r.id];
      return `<div style="display:flex;flex-direction:column;gap:12px"><div class="person" style="align-items:flex-start"><span class="opt-t"><small style="text-transform:uppercase;letter-spacing:.06em;font-size:12px;font-weight:600">${m.meal === 'midi' ? (m.box ? 'Midi · gamelle' : 'Midi') : (S.foyer.soirLeger ? 'Soir léger' : 'Soir')}</small>
        ${r.discover ? '<span class="tag warn" style="align-self:flex-start;font-size:12px;padding:3px 9px;margin:2px 0">À découvrir</span>' : ''}
        <b>${r.name}${hasSide(r) ? '<span style="font-weight:500;color:var(--primary)"> + salade verte</span>' : ''}</b><small>${CUISINES.find(c => c.id === r.cuisine).t} · ${r.min} min · ${TYPE_LABEL[r.type]} · ${euros(recipeCost(r, h.portions))}</small></span>
        <button class="link" data-act="swap" data-i="${m.idx}" aria-label="Changer le plat du ${d.toLowerCase()} ${m.meal}">Changer</button></div>
        <button class="link" style="align-self:flex-start;min-height:36px" data-act="open" data-i="${m.idx}" aria-expanded="${open}">${open ? 'Masquer la recette' : 'Ingrédients et recette'}</button>
        ${open ? recipeBody(r, h.portions, 'Pour le foyer') : ''}</div>`;
    }).join('')}</div>`;
  });
  html += `<p class="note">Prix moyens estimés, à remplacer par tes prix dans la liste de courses. ${S.foyer.bio !== 'non' ? 'Surcoût bio inclus.' : ''}</p></div>
    <div class="spacer"></div><div class="actions"><button class="btn" data-act="courses">Liste de courses</button>
    <div class="grid2"><button class="btn ghost" data-act="share-week">Partager le menu</button><button class="btn ghost" data-act="print-week">Imprimer les recettes</button></div></div>`;
  return html;
}

/* ---------- Recettes : bloc détaillé, partage, impression ---------- */
function portionsLabel(n){ const v = Math.round(n * 10) / 10; return v.toLocaleString('fr-FR') + ' portion' + (v > 1 ? 's' : '') + ' adulte' + (v > 1 ? 's' : ''); }
function ingLines(r, n){ return Object.entries(mealIng(r)).map(([k,q]) => [ING[k][0], fmtQty(k, q * n)]); }
function recipeBody(r, n, label){
  const q = encodeURIComponent(r.name), mine = S.links && S.links[r.id];
  return `<div class="rbody">
    <div style="display:flex;flex-direction:column;gap:8px"><h3>Ingrédients · ${label || portionsLabel(n)}</h3>
      <ul class="ing">${ingLines(r, n).map(([a,b]) => `<li><span>${a}</span><span>${b}</span></li>`).join('')}</ul>
      ${hasSide(r) ? '<small class="hint">Salade verte et vinaigrette ajoutées pour compléter en légumes.</small>' : ''}</div>
    <div style="display:flex;flex-direction:column;gap:8px"><h3>Préparation</h3>
      <ol class="steps">${stepsOf(r).map(s => `<li>${esc(s)}</li>`).join('')}</ol></div>
    <div class="grid2"><button class="btn ghost" style="min-height:44px;font-size:15px" data-act="share-recipe" data-id="${r.id}" data-n="${n}">Partager</button>
      <button class="btn ghost" style="min-height:44px;font-size:15px" data-act="print-recipe" data-id="${r.id}" data-n="${n}">Imprimer</button></div>
    <div class="chips">
      ${mine ? `<a class="btn linkbtn" href="${esc(mine)}" target="_blank" rel="noopener">Ma recette</a>` : ''}
      <a class="btn linkbtn ${mine ? 'ghost' : ''}" href="https://www.marmiton.org/recettes/recherche.aspx?aqt=${q}" target="_blank" rel="noopener">Marmiton</a>
      <a class="btn ghost linkbtn" href="https://www.google.com/search?q=recette+${q}" target="_blank" rel="noopener">Chercher sur le web</a>
    </div>
    <div class="field"><label class="label" for="l-${r.id}" style="font-size:13px">${mine ? 'Ton lien pour ce plat' : 'Une recette préférée ? Colle son lien'}</label>
      <div style="display:flex;gap:8px"><input class="input" style="height:44px;font-size:15px" id="l-${r.id}" data-link="${r.id}" type="url" placeholder="https://…" value="${esc(mine || '')}">
      <button class="link" data-act="link-ok" data-k="${r.id}">OK</button></div>
      <p class="error" role="alert">${view.linkErr === r.id ? 'Le lien doit commencer par https://' : ''}</p></div>
  </div>`;
}
const APP_URL = 'https://pellizzarimax.github.io/mieux-manger/';
function recipeText(r, n){
  return `${r.name}\n${CUISINES.find(c => c.id === r.cuisine).t} · ${r.min} min · ${portionsLabel(n)}\n\nIngrédients\n` +
    ingLines(r, n).map(([a,b]) => `- ${a} : ${b}`).join('\n') +
    `\n\nPréparation\n` + stepsOf(r).map((s,i) => `${i+1}. ${s}`).join('\n') + `\n\nMieux Manger · ${APP_URL}`;
}
function weekText(){
  const plan = S.plan || [];
  return 'Menus de la semaine\n\n' + DAYS.map((d,i) => d + '\n' + plan.filter(m => m.day === i && m.r).map(m => {
    const r = RECIPES.find(x => x.id === m.r);
    return `- ${m.meal === 'midi' ? 'Midi' : 'Soir'} : ${r.name}${hasSide(r) ? ' + salade verte' : ''}`;
  }).join('\n')).join('\n\n') + `\n\nMieux Manger · ${APP_URL}`;
}
function listText(){
  const tot = shopping(), checked = S.checked || {};
  const keys = Object.keys(tot).filter(k => !checked[k]);
  return 'Liste de courses\n' + CATS.map(cat => {
    const items = keys.filter(k => ING[k][1] === cat).sort((a,b) => ING[a][0].localeCompare(ING[b][0], 'fr'));
    return items.length ? `\n${cat}\n` + items.map(k => `- ${ING[k][0]} (${fmtQty(k, tot[k])})`).join('\n') : '';
  }).join('') + '\n';
}
let toastTimer;
function toast(msg){
  const t = document.getElementById('toast'); if(!t) return;
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2600);
}
function shareOrCopy(title, text){
  if(navigator.share){
    navigator.share({title, text}).catch(e => { if(!e || e.name !== 'AbortError') copyText(text); });
    return;
  }
  copyText(text);
}
function copyText(text){
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(() => toast('Copié : colle-le dans un message'), () => toast('Le partage n’est pas disponible ici'));
  } else toast('Le partage n’est pas disponible ici');
}
function printRecipeHTML(r, n){
  return `<article class="pr"><h2>${esc(r.name)}</h2>
    <p class="pm">${CUISINES.find(c => c.id === r.cuisine).t} · ${r.min} min · ${portionsLabel(n)}${r.light ? ' · Soir léger' : ''}</p>
    <div class="pc"><div><h3>Ingrédients</h3><ul>${ingLines(r, n).map(([a,b]) => `<li>${a} : ${b}</li>`).join('')}</ul></div>
    <div><h3>Préparation</h3><ol>${stepsOf(r).map(s => `<li>${esc(s)}</li>`).join('')}</ol></div></div></article>`;
}
function doPrint(title, items, intro){
  const el = document.getElementById('print');
  el.innerHTML = `<header class="ph"><b>Mieux Manger</b><span>${esc(title)}</span></header>${intro || ''}` + items.map(([r,n]) => printRecipeHTML(r, n)).join('');
  try{ window.print(); }catch(e){ toast('Impression indisponible ici'); }
}
function printWeek(){
  const h = household(), plan = S.plan || [];
  const table = `<table class="pweek"><tr><th>Jour</th><th>Midi</th><th>Soir</th></tr>` + DAYS.map((d,i) => {
    const at = meal => { const m = plan.find(x => x.day === i && x.meal === meal && x.r); return m ? esc(RECIPES.find(r => r.id === m.r).name) : '–'; };
    return `<tr><td>${d}</td><td>${at('midi')}</td><td>${at('soir')}</td></tr>`;
  }).join('') + '</table>';
  const seen = [], items = [];
  plan.forEach(m => { if(m.r && !seen.includes(m.r)){ seen.push(m.r); items.push([RECIPES.find(r => r.id === m.r), h.portions]); } });
  doPrint('Menus et recettes de la semaine', items, table);
}

/* ---------- Bibliothèque ---------- */
const LIB_FILTERS = [['all','Toutes'],['light','Soir léger'],['vege','Sans viande ni poisson'],['quick','15 min'],['salade','Salades'],['soupe','Soupes'],['discover','À découvrir']];
function libDefaultN(){ return S.people.length ? Math.max(1, Math.round(household().portions)) : 2; }
function libResults(){
  const v = view, h = household(), q = norm(v.q || '');
  return RECIPES.filter(r => {
    if(v.cuisine && v.cuisine !== 'all' && r.cuisine !== v.cuisine) return false;
    if(v.filter === 'light' && !r.light) return false;
    if(v.filter === 'vege' && !VEGE_TYPES.includes(r.type)) return false;
    if(v.filter === 'quick' && r.min > 15) return false;
    if(v.filter === 'salade' && !/salade|taboul|fattouche|caprese/i.test(r.name)) return false;
    if(v.filter === 'soupe' && !/soupe|velout|bouillon|harira|chorba|pho|ramen|miso|gaspacho|garbure|pozole|blaff|minestrone/i.test(r.name)) return false;
    if(v.filter === 'discover' && !r.discover) return false;
    if(q && !norm(r.name).includes(q) && !Object.keys(r.ing).some(k => norm(ING[k][0]).includes(q))) return false;
    return true;
  }).sort((a,b) => a.name.localeCompare(b.name, 'fr'));
}
function libList(){
  const h = household(), list = libResults();
  if(!list.length) return `<p class="note">Aucune recette ne correspond. Essaie un autre mot ou un autre filtre.</p>`;
  return list.map(r => {
    const open = view.libOpen === r.id, ok = !S.people.length || compatible(r, h, true);
    return `<div class="rcard"><button class="rhead" data-act="lib-open" data-id="${r.id}" aria-expanded="${open}">
      <span class="opt-t" style="flex:1"><b style="font-size:16px">${r.name}</b>
      <small>${CUISINES.find(c => c.id === r.cuisine).t} · ${r.min} min · ${TYPE_LABEL[r.type]}${r.light ? ' · Soir léger' : ''}</small>
      ${r.discover || !ok ? `<span class="chips" style="gap:6px;margin-top:4px">${r.discover ? '<span class="tag warn" style="font-size:12px;padding:3px 9px">À découvrir</span>' : ''}${!ok ? '<span class="tag" style="font-size:12px;padding:3px 9px;background:var(--track);color:var(--muted)">Pas pour le foyer</span>' : ''}</span>` : ''}</span>
      <span aria-hidden="true" style="font-size:22px;color:var(--subtle);line-height:1">${open ? '−' : '+'}</span></button>
      ${open ? `<div class="stepper"><button data-act="n-minus" aria-label="Moins de portions">−</button><b>${view.n}</b><button data-act="n-plus" aria-label="Plus de portions">+</button><span class="hint">portions adultes</span></div>
        ${!ok ? '<p class="note">Cette recette contient un aliment exclu par un profil du foyer (allergie, goût ou régime).</p>' : ''}
        ${recipeBody(r, view.n)}` : ''}</div>`;
  }).join('');
}
function renderLibrary(){
  const v = view, count = libResults().length;
  return `<div class="top"><button class="icon-btn" aria-label="Retour" data-act="home">${icons.back}</button><span class="count" style="flex:1">${RECIPES.length} recettes</span></div>` +
    head('Bibliothèque', 'Toutes les recettes', 'Cherche par plat ou par ingrédient, puis imprime ou partage.') +
    `<div class="body">
      <label class="search" for="libq"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input id="libq" data-libq="1" type="search" placeholder="ex. poulet, lentilles, curry…" value="${esc(v.q || '')}" aria-label="Rechercher une recette"></label>
      <div class="chips scroll">${[['all','Toutes cuisines'], ...CUISINES.map(c => [c.id, c.t])].map(([id,t]) => `<button class="chip" aria-pressed="${(v.cuisine || 'all') === id}" data-libc="${id}">${t}</button>`).join('')}</div>
      <div class="chips scroll">${LIB_FILTERS.map(([id,t]) => `<button class="chip" aria-pressed="${(v.filter || 'all') === id}" data-libf="${id}">${t}</button>`).join('')}</div>
      <div class="person"><span class="hint" id="libcount" style="flex:1">${count} recette${count > 1 ? 's' : ''}</span>
        <button class="link" data-act="print-lib">Imprimer la sélection</button></div>
      <div class="card" style="padding:4px 16px" id="liblist">${libList()}</div>
    </div>`;
}
function renderCourses(){
  const tot = shopping(), checked = S.checked || {};
  const keys = Object.keys(tot);
  const total = keys.reduce((t,k) => t + lineCost(k, tot[k]), 0);
  const left = keys.filter(k => !checked[k]).length;
  let html = `<div class="top"><button class="icon-btn" aria-label="Retour" data-act="menus">${icons.back}</button><span class="count" style="flex:1">${left} article${left>1?'s':''} restant${left>1?'s':''}</span></div>`;
  html += head('Courses', 'Liste de la semaine', `Total estimé : ${euros(total)}. Touche un prix pour mettre le tien.`);
  html += `<div class="body"><button class="btn ghost" data-act="share-list">Partager la liste (articles restants)</button>`;
  CATS.forEach(cat => {
    const items = keys.filter(k => ING[k][1] === cat).sort((a,b) => ING[a][0].localeCompare(ING[b][0], 'fr'));
    if(!items.length) return;
    html += `<h2 class="section-title">${cat}</h2><div class="card" style="gap:4px;padding:8px 16px">${items.map(k => {
      const editing = view.edit === k, mine = S.prices && S.prices[k] != null;
      return `<div class="person" style="min-height:56px;gap:12px">
        <input type="checkbox" id="c-${k}" data-tick="${k}" ${checked[k] ? 'checked' : ''} style="width:24px;height:24px;accent-color:var(--primary);margin:0;flex-shrink:0">
        <label for="c-${k}" class="opt-t" style="flex:1;cursor:pointer;${checked[k] ? 'text-decoration:line-through;opacity:.6' : ''}"><b style="font-size:15px">${ING[k][0]}</b><small>${fmtQty(k, tot[k])}</small></label>
        ${editing ? `<div class="unit" style="height:44px;width:120px;padding:0 10px"><input id="p-${k}" data-price="${k}" inputmode="decimal" value="${String(unitPrice(k)).replace('.',',')}" aria-label="Prix ${ING[k][0]} en ${unitLabel(k)}"><span style="font-size:12px">${unitLabel(k)}</span></div>
          <button class="link" data-act="price-ok" data-k="${k}">OK</button>`
        : `<button class="link" style="font-variant-numeric:tabular-nums;${mine ? '' : 'color:var(--subtle);font-weight:500'}" data-act="price" data-k="${k}" aria-label="Modifier le prix de ${ING[k][0]}">${euros(lineCost(k, tot[k]))}</button>`}
      </div>`;
    }).join('')}</div>`;
  });
  html += `<p class="note">En gris : prix moyen estimé. En vert : ton prix. Tes prix sont gardés pour les semaines suivantes.</p></div>`;
  return html;
}
/* ---------- Événements ---------- */
const app = document.getElementById('app');
app.addEventListener('input', e => {
  if(e.target.dataset.price){ view.priceVal = e.target.value; return; }
  if(e.target.dataset.link){ view.linkVal = e.target.value; return; }
  if(e.target.dataset.libq){
    view.q = e.target.value; view.libOpen = null;
    const n = libResults().length;
    document.getElementById('liblist').innerHTML = libList();
    document.getElementById('libcount').textContent = `${n} recette${n > 1 ? 's' : ''}`;
    return;
  }
  const f = e.target.dataset.field; if(!f) return;
  view.draft[f] = e.target.value;
});
app.addEventListener('keydown', e => {
  if(e.key === 'Enter' && e.target.dataset.price){ e.preventDefault(); commitPrice(e.target.dataset.price); render(); }
});
function commitPrice(k){
  if(view.priceVal != null){
    const v = parseFloat(String(view.priceVal).replace(',','.'));
    S.prices = S.prices || {};
    if(v > 0 && v < 1000) S.prices[k] = v;
    save();
  }
  view.edit = null; view.priceVal = null;
}
app.addEventListener('change', e => {
  const t = e.target.dataset.tick;
  if(t){ S.checked = S.checked || {}; S.checked[t] = e.target.checked; save(); render(); return; }
  const c = e.target.dataset.check; if(!c) return;
  view.draft[c] = e.target.checked; render();
});
app.addEventListener('click', e => {
  const b = e.target.closest('button'); if(!b || b.disabled) return;
  error = '';
  if(b.dataset.set){
    view.draft[b.dataset.set] = b.dataset.val;
    if(b.dataset.set === 'type' && view.draft.type === 'enfant'){ view.draft.objectif = 'equilibre'; view.draft.metier = false; }
    return render();
  }
  if(b.dataset.cuisine){
    const c = b.dataset.cuisine, list = view.draft.cuisines || [];
    view.draft.cuisines = list.includes(c) ? list.filter(x => x !== c) : [...list, c];
    if(!view.draft.cuisines.length) view.draft.cuisineStrict = false;
    return render();
  }
  if(b.dataset.allergen){
    const a = b.dataset.allergen, list = view.draft.allergies;
    view.draft.allergies = list.includes(a) ? list.filter(x => x !== a) : [...list, a];
    return render();
  }
  const act = b.dataset.act;
  if(act === 'next'){
    if(view.name === 'person'){
      error = validatePerson(); if(error) return render();
      if(view.step < stepsFor(view.draft).length - 1){ view.step++; }
      else {
        const i = S.people.findIndex(x => x.id === view.draft.id);
        if(i >= 0) S.people[i] = view.draft; else S.people.push(view.draft);
        save(); view = {name:'recap', id:view.draft.id};
      }
    } else if(view.name === 'foyer'){
      if(view.step === 0){
        const v = +String(view.draft.budget).replace(',','.');
        if(!(v >= 10 && v <= 2000)){ error = 'Indique un budget entre 10 et 2 000 € par semaine.'; return render(); }
        view.draft.budget = String(Math.round(v)); view.step++;
      } else if(view.step === 1){ view.step++; }
      else { view.draft.done = true; S.foyer = view.draft; save(); view = {name:'home'}; }
    }
  }
  if(act === 'back'){
    if(view.name === 'person'){ if(view.step > 0) view.step--; else view = {name:'home'}; }
    else if(view.name === 'foyer'){ if(view.step > 0) view.step--; else view = {name:'home'}; }
    else view = {name:'home'};
  }
  if(act === 'add') view = {name:'person', step:0, draft:blankPerson(), isNew:true};
  if(act === 'foyer') view = {name:'foyer', step:0, draft:{...S.foyer, midi:midiMode(S.foyer)}};
  if(act === 'home') view = {name:'home'};
  if(act === 'see') view = {name:'recap', id:b.dataset.id};
  if(act === 'edit'){ const p = S.people.find(x => x.id === b.dataset.id); view = {name:'person', step:0, draft:JSON.parse(JSON.stringify(p))}; }
  if(act === 'regen'){ generate(); view = {name:'menus'}; }
  if(act === 'menus') view = {name:'menus'};
  if(act === 'courses') view = {name:'courses'};
  if(act === 'swap'){
    const i = +b.dataset.i, h = household();
    const next = pick(S.plan[i], S.plan, i, h, S.plan[i].r);
    if(next){ S.plan[i].r = next; save(); }
    render(); return;
  }
  if(act === 'price'){ if(view.edit) commitPrice(view.edit); view.edit = b.dataset.k; view.priceVal = null; render(); const el = document.getElementById('p-' + b.dataset.k); if(el){ el.focus(); el.select(); } return; }
  if(act === 'price-ok'){ commitPrice(b.dataset.k); render(); return; }
  if(act === 'open'){ const i = +b.dataset.i; view.open = view.open === i ? null : i; view.linkErr = null; view.linkVal = null; render(); return; }
  if(act === 'link-ok'){
    const k = b.dataset.k, v = String(view.linkVal ?? (S.links && S.links[k]) ?? '').trim();
    S.links = S.links || {};
    if(!v){ delete S.links[k]; view.linkErr = null; }
    else if(/^https:\/\/\S+$/i.test(v)){ S.links[k] = v; view.linkErr = null; }
    else { view.linkErr = k; render(); return; }
    view.linkVal = null; save(); render(); return;
  }
  if(act === 'ask-reset') confirmReset = true;
  if(act === 'cancel-reset') confirmReset = false;
  if(b.dataset.libc){ view.cuisine = b.dataset.libc; view.libOpen = null; render(); return; }
  if(b.dataset.libf){ view.filter = b.dataset.libf; view.libOpen = null; render(); return; }
  if(act === 'library'){ view = {name:'library', q:'', cuisine:'all', filter:'all', libOpen:null, n:libDefaultN()}; render(); window.scrollTo(0, 0); return; }
  if(act === 'lib-open'){ view.libOpen = view.libOpen === b.dataset.id ? null : b.dataset.id; view.linkErr = null; view.linkVal = null; render(); return; }
  if(act === 'n-minus'){ view.n = Math.max(1, view.n - 1); render(); return; }
  if(act === 'n-plus'){ view.n = Math.min(12, view.n + 1); render(); return; }
  if(act === 'share-recipe'){ const r = RECIPES.find(x => x.id === b.dataset.id); shareOrCopy(r.name, recipeText(r, +b.dataset.n)); return; }
  if(act === 'print-recipe'){ const r = RECIPES.find(x => x.id === b.dataset.id); doPrint(r.name, [[r, +b.dataset.n]]); return; }
  if(act === 'share-week'){ shareOrCopy('Menus de la semaine', weekText()); return; }
  if(act === 'print-week'){ printWeek(); return; }
  if(act === 'share-list'){ shareOrCopy('Liste de courses', listText()); return; }
  if(act === 'print-lib'){
    const list = libResults();
    const label = [view.cuisine && view.cuisine !== 'all' ? CUISINES.find(c => c.id === view.cuisine).t : '', (LIB_FILTERS.find(f => f[0] === view.filter) || [])[1], view.q ? `« ${view.q} »` : ''].filter(x => x && x !== 'Toutes').join(' · ');
    doPrint(`Bibliothèque${label ? ' · ' + label : ''} (${list.length} recettes)`, list.map(r => [r, view.n]));
    return;
  }
  if(act === 'ask-del'){ view.delId = b.dataset.id; render(); return; }
  if(act === 'cancel-del'){ view.delId = null; render(); return; }
  if(act === 'del'){
    const p = S.people.find(x => x.id === b.dataset.id);
    S.people = S.people.filter(x => x.id !== b.dataset.id); save();
    view = S.people.length ? {name:'home'} : {name:'person', step:0, draft:blankPerson(), isNew:true};
    render(); window.scrollTo(0, 0);
    if(p) toast(`Profil de ${p.prenom} supprimé`);
    return;
  }
  if(act === 'reset'){ confirmReset = false; S = {people:[], foyer:blankFoyer()}; save(); view = {name:'person', step:0, draft:blankPerson(), isNew:true}; }
  render();
  window.scrollTo(0, 0);
});
render();
</script>
<script>
if('serviceWorker' in navigator){ window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {})); }
</script>
</body>
</html>
